<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunaya Telemarketing</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Manrope:wght@400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: fondo crema cálido, tarjetas blancas, acento terracota; barra inferior fija para usar con el pulgar */
  --bg:#e8dcc6; --card:#fffdf8; --ink:#1f1e1d; --muted:#6f6a5e; --line:#dfd3bc; --soft:#f4ecdd;
  --accent:#d97757; --accent-ink:#ffffff; --accent-soft:#f6e3da; --deep:#3d3929;
  --good:#3f7d4e; --good-bg:#e5efe2; --warn:#a3651a; --warn-bg:#f8ecd6; --bad:#b4442f; --bad-bg:#f7e1db;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --body:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624; --card:#30302e; --ink:#f3f1ea; --muted:#a8a69c; --line:#43423e; --soft:#3a3936;
  --accent-soft:#4a3329; --deep:#e8e4d6; --good:#8cc79a; --good-bg:#2c3a2e; --warn:#e6b46a; --warn-bg:#40331f; --bad:#f09a86; --bad-bg:#45291f; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#262624; --card:#30302e; --ink:#f3f1ea; --muted:#a8a69c; --line:#43423e; --soft:#3a3936;
  --accent-soft:#4a3329; --deep:#e8e4d6; --good:#8cc79a; --good-bg:#2c3a2e; --warn:#e6b46a; --warn-bg:#40331f; --bad:#f09a86; --bad-bg:#45291f; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.top{padding:20px 16px 6px;max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:12px;border-bottom:1.5px solid var(--line)}
.brand svg{width:38px;height:38px;color:var(--accent);flex:none}
.brand .bn{font-family:var(--serif);font-weight:700;font-size:38px;line-height:1;letter-spacing:.08em;color:var(--ink)}
.me-big{background:none;border:0;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:0;color:var(--ink)}
.me-big .av{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent)}
.me-big .me-nm{font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.15;max-width:120px;text-align:center;text-wrap:balance;margin-top:4px}
.me-big small{font-size:11.5px;font-weight:700;color:var(--accent)}
.brand .bs{font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-top:4px}
h1{font-family:var(--serif);font-weight:700;font-size:24px;line-height:1.1;margin:8px 0 4px;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.sub{color:var(--muted);margin:0;font-size:14.5px}
.who{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;background:var(--accent-soft);color:var(--accent);font-weight:800;vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.nm-av{display:inline-flex;align-items:center;gap:8px}
button.pill{border:0;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:12px 16px 110px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
main>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2 .note{text-transform:none;letter-spacing:0;font-family:var(--body);font-weight:600}
.card h2{font-family:var(--serif);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px}
.tile{background:var(--soft);border-radius:12px;padding:12px}
.tile b{display:block;font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:700}
.tile small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tile.acc{background:var(--accent);color:var(--accent-ink)}.tile.acc span,.tile.acc small{color:#fde9e0}
.tile.alert{background:var(--bad-bg)}.tile.alert b,.tile.alert span{color:var(--bad)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13.5px}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:500;color:var(--ink)}
textarea.i{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:800;border-bottom:0}
.chat{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--bg,#efe6d8);border-radius:10px;margin-bottom:6px}.msg{background:#fff;border-radius:10px;padding:6px 10px;max-width:85%;align-self:flex-start;font-size:14px}.msg.mine{align-self:flex-end;background:#f6d9cc}.msg .mh{font-size:11px;opacity:.65;font-weight:700}.nbadge{display:inline-block;background:#c0392b;color:#fff;border-radius:9px;font-size:10px;padding:0 5px;margin-left:2px;font-weight:700}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tg-good{background:var(--good-bg);color:var(--good)}.tg-warn{background:var(--warn-bg);color:var(--warn)}.tg-bad{background:var(--bad-bg);color:var(--bad)}.tg-mute{background:var(--soft);color:var(--muted)}
.pct-good{color:var(--good);font-weight:800}.pct-mid{color:var(--warn);font-weight:800}.pct-low{color:var(--bad);font-weight:800}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.item .t{font-weight:700;font-size:16px}.item .m{color:var(--muted);font-size:13px}
.world{background:var(--deep);color:var(--bg);border-color:var(--deep)}
.world .nm{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.1;text-transform:uppercase}
.tally{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tally{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tb{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:16px 14px;text-align:left;cursor:pointer;display:grid;gap:4px;min-height:92px;transition:transform .08s}
.tb:active{transform:scale(.97)}
.tb .l{font-weight:800;font-size:16px}
.tb .c{font-family:var(--serif);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.tb .h{font-size:12px;color:var(--muted)}
.tb.cita{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.tb.cita .h{color:#fde9e0}
.tb.flash{outline:3px solid var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;background:var(--card);cursor:pointer}
.day b{display:block;font-family:var(--serif);font-size:22px;line-height:1.1}
.day span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.day small{display:block;font-size:11px;color:var(--muted)}
.day.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.day.on span,.day.on small{color:var(--line)}
.appt{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--card);border-radius:12px;padding:11px 13px;cursor:pointer;text-align:left;width:100%;display:grid;gap:2px}
.appt.hecha{border-left-color:var(--good)}.appt.no_se_hizo,.appt.cancelada{border-left-color:var(--muted)}
.appt .h{font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.appt .dia{font-weight:700;font-size:13px;color:var(--accent)}.appt .dia::first-letter{text-transform:uppercase}.hora{background:var(--accent);color:#fff;border-radius:8px;padding:3px 9px;font-size:14px;font-weight:800;white-space:nowrap}
.note{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.banner{border-radius:12px;padding:12px 14px;font-weight:600}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.bad{background:var(--bad-bg);color:var(--bad)}.banner.good{background:var(--good-bg);color:var(--good)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.bottom button{background:none;border:0;color:var(--muted);display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:700;padding:6px 6px;border-radius:10px;cursor:pointer;min-width:54px;flex:1;max-width:96px}
nav.bottom button.on{color:var(--accent);background:var(--accent-soft)}
nav.bottom svg{width:22px;height:22px}
nav.bottom.many button{font-size:10px;min-width:0;padding:6px 1px;letter-spacing:-.01em}
.modal-bg{position:fixed;inset:0;background:rgba(31,30,29,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px}
@media (min-width:700px){.modal-bg{align-items:center}.modal{border-radius:20px}}
.modal h3{font-family:var(--serif);font-weight:700;font-size:21px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:12px;font-weight:700;cursor:pointer;text-align:left}
.opt.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:90%;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:var(--accent);font-weight:800;cursor:pointer}
.rank{display:grid;gap:6px}
.rank div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--soft)}
.rank .pos{font-family:var(--serif);font-size:19px;width:26px;color:var(--muted)}
.rank .me{outline:2px solid var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3a8.5 8.5 0 1 0 6.4 14.1A7 7 0 0 1 14.5 3z" fill="currentColor"/></svg><div style="flex:1;min-width:0"><div class="bn">LUNAYA</div><div class="bs">Sistema de telemarketing</div></div><div id="me-slot"></div></div>
  <h1 id="title">Cargando…</h1>
  <p class="sub" id="subtitle">Conectando con el equipo.</p>
  <div class="who" id="who"></div>
</header>
<main id="main"><div class="card empty">Cargando…</div></main>
<nav class="bottom" id="nav" hidden></nav>
<div id="modal"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="qr.js?v=1"></script>
<script src="demo.js?v=202611041852"></script>
<script src="juego.js?v=202611041852"></script>
<script>
/* ===== Constantes ===== */
/* ===== Versión: si hay una nueva publicada, se avisa para recargar (así todas ven los mismos números) ===== */
const APP_VER = "202611041852";
async function checkVer(){ try { const r = await fetch("version.txt?t="+Date.now(), {cache:"no-store"}); if (!r.ok) return; const v = (await r.text()).trim(); if (v && v !== APP_VER && !document.getElementById("ver-bar")){ const b = document.createElement("div"); b.id = "ver-bar"; b.className = "banner warn"; b.style.cssText = "position:fixed;top:8px;left:8px;right:8px;z-index:99;display:flex;justify-content:space-between;align-items:center;gap:8px"; b.innerHTML = "<span>🔄 Hay una versión nueva de Lunaya.</span><button class='btn small'>Actualizar</button>"; b.querySelector("button").onclick = () => location.reload(); document.body.appendChild(b); } } catch {} }
setTimeout(checkVer, 3000); setInterval(checkVer, 5*60e3); document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVer(); });
const TZ = "America/Los_Angeles";
const DEFAULT_SOURCES = ["Referencias","4/14","Abordajes","Clientes del sistema","Redes sociales","Otro"];
const RESULTS = [
  ["no_contesto","No contestó"],["buzon","Buzón / apagado"],["volver","Llamar después"],
  ["no_interesa","No le interesa"],["no_califica","No califica"],["cita","Cita"]
];
const RLABEL = Object.fromEntries(RESULTS);
const CONTACT = new Set(["volver","no_interesa","no_califica","cita"]);
const APPT_ST = {agendada:"Agendada", hecha:"Demostración hecha", no_se_hizo:"No se hizo", cancelada:"Cancelada"};
const ROLE = {admin:"Dirección", tele:"Telemarketer", socio:"Socio", pendiente:"Pendiente"};
const DEF_COM = {sueldo:200, pct:2, liderPct:1, distPct:5};
const APP_URL = location.origin + location.pathname;
const INV_ROLES = {tele:"Telemarketer", distribuidor:"Socio distribuidor", emprendedor:"Emprendedor"};

/* ===== Estado ===== */
const S = {
  db:null, auth:null, authUser:null, email:"", owners:[], unsub:[], subscribed:false, pendingCode:"", uid:null, me:null, isOwner:false, canWrite:null,
  members:{}, appts:{}, logs:{}, config:{}, invites:{}, drives:{}, loaded:{me:false, members:false, appts:false, logs:false},
  view:"hoy", f:{period:"mes", day:null, aSocio:"", source:""}, world:"", timedOut:false, flash:null
};
try { S.world = localStorage.getItem("ly-world") || ""; S.f.source = localStorage.getItem("ly-src") || ""; } catch {}
const writeChains = {};

/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits = p => String(p||"").replace(/\D/g,"");
function partsLA(ms){ const o = {}; new Intl.DateTimeFormat("en-US",{timeZone:TZ,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date(ms)).forEach(p => o[p.type] = p.value); return o; }
function tzOff(ms){ const p = partsLA(ms); return Date.UTC(+p.year, +p.month-1, +p.day, +p.hour % 24, +p.minute, +p.second) - Math.floor(ms/1000)*1000; }
function laToMs(d, t){ const [y,m,da] = d.split("-").map(Number); const [h,mi] = (t||"00:00").split(":").map(Number); const g = Date.UTC(y,m-1,da,h,mi); const ms = g - tzOff(g); return g - tzOff(ms); }
const laDate = ms => { const p = partsLA(ms); return `${p.year}-${p.month}-${p.day}`; };
const laTime = ms => { const p = partsLA(ms); return `${p.hour}:${p.minute}`; };
function addDays(d, n){ const [y,m,da] = d.split("-").map(Number); return new Date(Date.UTC(y,m-1,da+n,12)).toISOString().slice(0,10); }
function addMonths(d, n){ const [y,m] = d.split("-").map(Number); return new Date(Date.UTC(y,m-1+n,1,12)).toISOString().slice(0,10); }
const fmt = (ms, o) => new Intl.DateTimeFormat("es-US",{timeZone:TZ,...o}).format(new Date(ms));
const fmtWhen = ms => fmt(ms,{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const today = () => laDate(Date.now());
function mondayOf(d){ const [y,m,da] = d.split("-").map(Number); const dow = (new Date(Date.UTC(y,m-1,da,12)).getUTCDay()+6)%7; return addDays(d,-dow); }
function range(p){
  const t = today();
  if (p==="hoy") return [laToMs(t,"00:00"), laToMs(addDays(t,1),"00:00")];
  if (p==="semana"){ const mo = mondayOf(t); return [laToMs(mo,"00:00"), laToMs(addDays(mo,7),"00:00")]; }
  if (p==="quin" || p==="quinant"){ const m1 = t.slice(0,8)+"01", m16 = t.slice(0,8)+"16", prim = t < m16;
    const cur = prim ? [m1, m16] : [m16, addMonths(m1,1)]; const ant = prim ? [addMonths(m1,-1).slice(0,8)+"16", m1] : [m1, m16];
    const [a,b] = p==="quin" ? cur : ant; return [laToMs(a,"00:00"), laToMs(b,"00:00")]; }
  if (p==="mesant"){ const f = addMonths(t.slice(0,8)+"01",-1); return [laToMs(f,"00:00"), laToMs(t.slice(0,8)+"01","00:00")]; }
  const f = t.slice(0,8)+"01"; return [laToMs(f,"00:00"), laToMs(addMonths(f,1),"00:00")];
}
const PLABEL = {hoy:"Hoy", semana:"Esta semana", quin:"Esta quincena", quinant:"Quincena anterior", mes:"Este mes", mesant:"Mes anterior"};
const rangoTxt = p => { const [a,b] = range(p); return `${fmt(a,{day:"numeric",month:"short"})} al ${fmt(b-1,{day:"numeric",month:"short"})}`; };
const money = n => "$" + (Math.round((n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
const pctN = (a,b) => b ? Math.round(a*100/b) : null;
function pctHtml(a,b,good=50,mid=30){ const p = pctN(a,b); if (p===null) return `<span class="note">—</span>`; return `<span class="${p>=good?"pct-good":p>=mid?"pct-mid":"pct-low"}">${p}%</span>`; }
const sources = () => (S.config.sources && S.config.sources.length) ? S.config.sources : DEFAULT_SOURCES;
const com = () => ({...DEF_COM, ...(S.config.comision||{})});
const memberName = id => S.members[id]?.name || "—";
function av(id, size=28){ const m = S.members[id]; const fs = Math.round(size*0.4);
  if (m?.photo && /^data:image\/(jpeg|png|webp);base64,/.test(m.photo)) return `<span class="av" style="width:${size}px;height:${size}px"><img src="${m.photo}" alt=""></span>`;
  const ini = (m?.name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${fs}px">${esc(ini)}</span>`; }

/* ===== Arranque (Firebase) ===== */
const onErr = e => { console.log(e); if (e && e.code === "permission-denied") return; S.timedOut = true; render(); };
function teardown(){ S.unsub.forEach(u => { try { u(); } catch {} }); S.unsub = []; S.tdSubs = {}; S.ldSubs = {}; S.subscribed = false; S.invSub = false;
  S.members = {}; S.appts = {}; S.logs = {}; S.config = {}; S.invites = {}; S.drives = {}; S.me = null; S.loaded = {me:false, members:false, appts:false, logs:false}; inviteDone = false; ownerDone = false; }

  if (hm){ S.pendingCode = hm[1].toUpperCase(); try { localStorage.setItem("ly-code", S.pendingCode); } catch {} try { history.replaceState(null, "", location.pathname); } catch {} }

function startData(){
  S.unsub.push(S.db.doc("members/"+S.uid).onSnapshot(s => {
    S.me = s.exists ? s.data() : null; if (S.me) S.members[S.uid] = S.me; S.loaded.me = true;
    if (S.isOwner && (!S.me || S.me.role !== "admin")) ensureOwner();
    const active = S.isOwner || (S.me && ["admin","tele","socio"].includes(S.me.role));
    if (active && !S.subscribed) subscribeAll(); else if (active) subInvites();
    if (!active && S.pendingCode && !inviteDone) acceptInvite(S.pendingCode).then(ok => { if (!ok && !inviteDone && S.pendingCode){ toast("Ese enlace de invitación ya se usó o no existe. Pide uno nuevo."); clearCode(); render(); } });
    render();

const PRIV_KEYS = ["client","phone","city","address","notes","chat","seen","resNote"];
/* Citas transferidas antes del arreglo: quien la recibió marca solo quién se la dio, para que esa persona la siga viendo */
let dadorFix = new Set();
function arreglarDador(){ const pv = Object.assign({}, ...Object.values(S.privs||{}));
  /* tv = cita del territorio de Dirección (la ven completa las telemarketers del programa). Se corrige si falta o quedó mal (por ejemplo, si el emprendedor cambió de grupo) */
  Object.entries(pv).forEach(([id,q]) => { if (!S.members[q.socioId] || dadorFix.has("tv"+id) || !(q.socioId===S.uid || q.up===S.uid || q.teleId===S.uid || role()==="admin")) return; const tv = S.members[pagadorDe(q.socioId)]?.role==="admin";
    if (q.tv !== tv){ dadorFix.add("tv"+id); S.db.doc("apptp/"+id).update({tv}).catch(e => console.log("tv", id, e)); } });
  Object.entries(S.apub||{}).forEach(([id,a]) => { const q = pv[id]; if (!q || dadorFix.has(id)) return;
    if (a.transferredFrom && a.socioId===S.uid && q.socioId===S.uid && !q.dador){ dadorFix.add(id); S.db.doc("apptp/"+id).update({dador:a.transferredFrom}).catch(()=>{}); } });
  /* Ventas: el nombre del cliente queda visible para Dirección (solo el nombre, para la nómina de comisiones); lo pone quien ve los datos de la cita */
  Object.entries(S.apub||{}).forEach(([id,a]) => { const q = pv[id]; if (!q || !a.sale || dadorFix.has("nv"+id)) return; const nm = String(q.client||"").trim().slice(0,80);
    if (!nm || a.nomVenta===nm) return; dadorFix.add("nv"+id); S.db.doc("appts/"+id).update({nomVenta:nm}).catch(e => console.log("nomVenta", id, e)); }); }
function mergeAppts(){ setTimeout(arreglarDador, 2000); const pv = Object.assign({}, ...Object.values(S.privs||{})); S.appts = {}; Object.entries(S.apub||{}).forEach(([id,a]) => { const x = {...a, agendo:a.teleId, teleId:a.teleCredit||a.teleId}; PRIV_KEYS.forEach(k => delete x[k]); const q = pv[id]; S.appts[id] = q ? {...x, client:q.client, phone:q.phone, city:q.city, address:q.address, notes:q.notes, chat:q.chat, seen:q.seen, resNote:q.resNote, dador:q.dador, refBy:q.refBy, _priv:true} : {...x, _priv:false}; }); }
const cName = a => a._priv ? (a.client||"Cliente") : "Cliente privado";
/* Separar Dirección: cada director ve solo los clientes de sus propios emprendedores.
   Pasa una vez: a los emprendedores sin grupo les pone como grupo a quien los invitó, y ajusta sus citas. */
let migDone = false;
async function migrarGrupos(){
  if (migDone || role()!=="admin" || !S.loaded.members || !S.loaded.appts) return; migDone = true;
  const mine = Object.entries(S.members).filter(([,m]) => m.role==="socio" && m.tipo!==DIST && !m.upline && (m.invitedBy===S.uid || (!m.invitedBy && S.isOwner)));
  for (const [id] of mine){ try { await S.db.doc("members/"+id).update({upline:S.uid}); } catch(e){ console.log(e); } }
  const ids = new Set(Object.entries(S.members).filter(([id,m]) => m.upline===S.uid || mine.some(([x])=>x===id)).map(([id])=>id));
  for (const [aid,a] of Object.entries(S.apub||{})) if (ids.has(a.socioId)) { try { await S.db.doc("apptp/"+aid).update({up:S.uid, dir:false}); } catch(e){ /* ya estaba */ } }
}
function subscribeAll(){
  if (S.subscribed) return; S.subscribed = true;
  const from = addMonths(today().slice(0,8)+"01", -1);
  const loadTimer = setTimeout(() => { if (!S.loaded.appts){ S.timedOut = true; render(); } }, 12000);
  S.unsub.push(S.db.collection("members").onSnapshot(s => { S.members = {}; s.docs.forEach(d => S.members[d.id] = d.data()); if (S.members[S.uid]) S.me = S.members[S.uid]; S.loaded.members = true; subTeleDists(); subLider(); render(); }, onErr));
  S.apub = {}; S.privs = {};
  S.unsub.push(S.db.collection("appts").onSnapshot(s => { S.apub = {}; s.docs.forEach(d => S.apub[d.id] = d.data()); S.loaded.appts = true; clearTimeout(loadTimer); S.timedOut = false; mergeAppts(); render(); setTimeout(migrarGrupos, 1500); }, onErr));
  const privQ = [["teleId", S.uid], ["socioId", S.uid], ["dador", S.uid]]; if (S.me?.role === "tele" && !S.me?.upline) privQ.push(["tv", true]); if (S.isOwner || S.me?.role === "admin") privQ.push(["up", S.uid]);
  privQ.forEach(([f,v]) => S.unsub.push(S.db.collection("apptp").where(f, "==", v).onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); S.privs[f] = m; (S.privLoaded = S.privLoaded||{})[f] = true; mergeAppts(); render(); }, e => console.log(e))));
  S.unsub.push(S.db.collection("calllog").where("date", ">=", from).onSnapshot(s => { S.logs = {}; s.docs.forEach(d => S.logs[d.id] = d.data()); S.loaded.logs = true; render(); }, onErr));
  S.unsub.push(S.db.doc("config/main").onSnapshot(s => { S.config = s.exists ? s.data() : {}; render(); }, onErr));
  { const q = (S.isOwner || S.me?.role==="admin") ? S.db.collection("pagosdist") : S.db.collection("pagosdist").where("payer", "==", S.uid);
    S.unsub.push(q.onSnapshot(s => { S.pagosDist = {}; s.docs.forEach(d => S.pagosDist[d.id] = d.data()); render(); }, e => console.log("pagosdist", e))); }
  if (S.me?.role === "tele") S.unsub.push(S.db.collection("drives").onSnapshot(s => { S.drives = {}; s.docs.forEach(d => S.drives[d.id] = d.data()); render(); }, e => console.log(e)));
  else S.unsub.push(S.db.doc("drives/"+S.uid).onSnapshot(s => { if (s.exists) S.drives[S.uid] = s.data(); else delete S.drives[S.uid]; render(); }, e => console.log(e)));
  if (S.me?.role === "socio" && S.me?.tipo === "Socio distribuidor"){
    S.unsub.push(S.db.collection("invites").where("invitedBy", "==", S.uid).onSnapshot(s => { S.invites = {}; s.docs.forEach(d => S.invites[d.id] = d.data()); render(); }, e => console.log(e)));
    S.unsub.push(S.db.collection("apptp").where("up", "==", S.uid).onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); S.privs.up = m; mergeAppts(); render(); }, e => console.log(e)));
  }
  subInvites();
  if (window.subJuegos) subJuegos();
}
const esTeleProg = uid => { const m = S.members[uid]; return !!m && (m.role==="tele" || m.prevRole==="tele") && !m.upline; };
/* La líder ve completas las citas de todas las telemarketers del programa */
function subLider(){
  if (!(S.me?.role==="tele" && S.me?.lider && !S.me?.upline) || !S.subscribed) return; S.ldSubs = S.ldSubs || {};
  telesLunaya().forEach(t => { if (S.ldSubs[t.id] || t.id===S.uid) return;
    const u = S.db.collection("apptp").where("teleId", "==", t.id).onSnapshot(s => { const m = {}; s.docs.forEach(x => m[x.id] = x.data()); S.privs["lt|"+t.id] = m; mergeAppts(); render(); }, e => console.log("lider", t.id, e));
    S.ldSubs[t.id] = u; S.unsub.push(u); });
}
/* Telemarketer del programa: ve completo el mundo de cada distribuidor que no la haya quitado (citas, clientes y prospectos) */
function subTeleDists(){
  if (S.me?.role !== "tele" || !S.subscribed) return; S.tdSubs = S.tdSubs || {};
  const want = new Set(S.me?.upline ? [S.me.upline] : distsDeTele(S.uid));
  Object.keys(S.tdSubs).forEach(d => { if (!want.has(d)){ S.tdSubs[d].forEach(u => { try { u(); } catch {} }); delete S.tdSubs[d]; delete S.privs["dup|"+d]; delete S.privs["dso|"+d]; mergeAppts(); } });
  want.forEach(d => { if (S.tdSubs[d]) return; const us = [];
    [["up","dup"],["socioId","dso"]].forEach(([f,k]) => us.push(S.db.collection("apptp").where(f, "==", d).onSnapshot(s => { const m = {}; s.docs.forEach(x => m[x.id] = x.data()); S.privs[k+"|"+d] = m; mergeAppts(); render(); }, e => console.log("dist", d, e))));
    if (window.jgSub){ us.push(...jgSub("up", d), ...jgSub("socioId", d)); }
    S.tdSubs[d] = us; S.unsub.push(() => us.forEach(u => { try { u(); } catch {} })); });
}
/* Quién de las telemarketers del programa entra al mundo de un distribuidor */

const clearCode = () => { S.pendingCode = ""; try { localStorage.removeItem("ly-code"); } catch {} };
const MEMBER_ROLE = r => r==="tele" ? "tele" : r==="admin" ? "admin" : "socio";
/* Invitación por enlace o código: entra directo con el rol de la invitación */
let inviteDone = false;
async function acceptInvite(code){
  if (inviteDone || S.isOwner || !S.uid || !code) return false;
  if (S.me && S.me.role !== "pendiente") return false;
  const c = String(code).trim().toUpperCase(); if (!/^[A-Z0-9]{6}$/.test(c)) return false;
  inviteDone = true;
  try {
    const snap = await S.db.doc("invites/"+c).get();
    if (!snap.exists || snap.data().status === "aceptada"){ inviteDone = false; return false; }
    const v = snap.data();
    await S.db.doc("members/"+S.uid).set({name: S.me?.name || v.name || S.authUser?.displayName || "", phone: S.me?.phone || v.phone || "", email: S.email, role: MEMBER_ROLE(v.role), tipo: (v.role==="tele"||v.role==="admin") ? "" : INV_ROLES[v.role], lider:false, joinedAt: Date.now(), invitedBy: v.invitedBy || "", upline: v.upline || "", genero: v.genero || "", inviteCode: c, ...(v.sueldo!==undefined?{sueldo:v.sueldo}:{}), ...(v.pct!==undefined?{pct:v.pct}:{}), ...(v.aporte!==undefined?{aporte:v.aporte}:{}), ...(v.startDate?{startDate:v.startDate}:{})});
    await S.db.doc("invites/"+c).update({status:"aceptada", acceptedAt:Date.now(), uid:S.uid});
    clearCode(); toast(v.genero==="h" ? "¡Bienvenido al equipo!" : v.genero==="m" ? "¡Bienvenida al equipo!" : "¡Te damos la bienvenida al equipo!"); return true;

function teleEval(teleId, r, socioId){
  const calls = allCalls().filter(c => inR(c.at, r) && (!teleId || c.teleId===teleId) && (!socioId || c.socioId===socioId));
  const ap = Object.values(S.appts).filter(a => (!teleId || a.teleId===teleId) && (!socioId || a.socioId===socioId));
  const agendadas = ap.filter(a => inR(a.createdAt||0, r));
  const held = ap.filter(a => inR(a.when||0, r) && a.when <= Date.now() && a.status !== "cancelada");
  const conRes = held.filter(a => a.status !== "agendada");
  const demos = held.filter(a => a.status==="hecha");
  const allSales = demos.filter(a => a.sale);
  const ss = a => a.saleStatus || "pendiente";
  const ventas = allSales.filter(a => ss(a) !== "cancelada");
  const aprob = allSales.filter(a => ss(a) === "aprobada");
  const sum = l => l.reduce((s,a)=>s+(+a.amount||0),0);
  const refs = allRefs().filter(x => inR(x.at, r) && (!teleId || x.teleId===teleId) && (!socioId || x.socioId===socioId)).reduce((t,x)=>t+(+x.n||0),0);
  return {referidos:refs, calls:calls.length, contacts:calls.filter(c=>CONTACT.has(c.result)).length, citas:agendadas.length,
    pasadas:held.length, conRes:conRes.length, sinRes:held.length-conRes.length, demos:demos.length, ventas:ventas.length,
    monto:sum(ventas), aprob:aprob.length, montoAprob:sum(aprob), pend:ventas.length-aprob.length, cancel:allSales.length-ventas.length};
}
const SALE_ST = {pendiente:"Pendiente de aprobación", aprobada:"Aprobada", cancelada:"Cancelada"};
/* Días laborales (lunes a sábado) entre dos fechas YYYY-MM-DD, ambas incluidas */
function workDays(a, b){ let n = 0; for (let d = a; d <= b; d = addDays(d,1)){ const [y,m,da] = d.split("-").map(Number); if (new Date(Date.UTC(y,m-1,da,12)).getUTCDay() !== 0) n++; } return n; }
const startOf = t => t.startDate || (t.joinedAt ? laDate(t.joinedAt) : "2000-01-01");
/* Sueldo proporcional: se acumula por día laboral trabajado (lun–sáb) dentro del mes */
function sueldoDe(t, r, base){
  const m0 = laDate(r[0]), m1 = laDate(r[1]-1); const total = workDays(m0, m1);
  let a = m0 > startOf(t) ? m0 : startOf(t); let b = m1 < today() ? m1 : today();
  if (t.leftAt){ const l = laDate(t.leftAt); if (l < b) b = l; }
  const dias = a <= b ? workDays(a, b) : 0;
  return {sueldo: total ? base * dias / total : 0, dias, total};
}

  if (!base && !v.length) return null;
  const rows = v.map(([id,a]) => { const py = a.pasoPor || m.upline, pl = planDe(py) || base || DEF_EMP; const c = catEmp(a), pct = +pl[c]||0, st = a.saleStatus||"pendiente"; return {id, a, c, pct, st, payer:py, com: st==="aprobada" ? (+a.amount||0)*pct/100 : 0, pot: st==="pendiente" ? (+a.amount||0)*pct/100 : 0}; });
  const plan = (payer && planDe(payer)) || base || DEF_EMP;
  const tot = rows.reduce((t,x)=>t+x.com,0), pend = rows.reduce((t,x)=>t+x.pot,0);
  const byCat = ["acomp","solo","asig"].map(c => { const l = rows.filter(x=>x.c===c && x.st==="aprobada"); return {c, pct:plan[c], n:l.length, vol:l.reduce((t,x)=>t+(+x.a.amount||0),0), com:l.reduce((t,x)=>t+x.com,0)}; });
  return {plan, rows, tot, pend, byCat}; }

function aporteCsv(p){ const ap = aportes(range(p)); const L = [["Distribuidor","Fecha","Cliente","Emprendedor","Telemarketer","Venta","Porcentaje","Comisión"]];
  Object.values(ap).filter(x => S.members[x.payer]?.role!=="admin").forEach(x => x.rows.forEach(r => L.push([memberName(x.payer), laDate(r.a.when), r.a._priv && r.a.client ? r.a.client : (r.a.nomVenta||""), memberName(r.a.socioId), memberName(r.a.teleId), +r.a.amount||0, r.pct+"%", Math.round(r.m*100)/100])));
  const cell = v => { const t = String(v ?? ""); return /[",\n]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; };
  const url = URL.createObjectURL(new Blob(["\ufeff" + L.map(r => r.map(cell).join(",")).join("\r\n")], {type:"text/csv;charset=utf-8"})); const a = document.createElement("a"); a.href = url; a.download = `nomina-distribuidores-${today()}.csv`; document.body.appendChild(a); a.click(); a.remove(); }

  return `<div class="card"><h2>Comisión de telemarketing por pagar<span class="note">${PLABEL[p]}</span></h2>

    ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Quién paga</th><th class="n">Ventas de telemarketing</th><th class="n">Volumen</th><th class="n">Porcentaje</th><th class="n">A pagar</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(memberName(x.payer))}</b><div class="note">${S.members[x.payer]?.tipo===DIST?"distribuidor":"dirección"}</div></td><td class="n">${x.ventas}</td><td class="n">${money(x.vol)}</td><td class="n"><b>${pctTxt(x)}</b><div class="note">${S.members[x.payer]?.tipo===DIST?"fijo":[...new Set(x.rows.map(r=>`${r.txt} = ${r.pct}%`))].join("<br>")}</div></td><td class="n"><b>${money(x.monto)}</b></td></tr>`).join("")}<tr class="total"><td>Total</td><td class="n">${rows.reduce((t,x)=>t+x.ventas,0)}</td><td class="n">${money(rows.reduce((t,x)=>t+x.vol,0))}</td><td></td><td class="n">${money(rows.reduce((t,x)=>t+x.monto,0))}</td></tr></tbody></table></div>`:`<div class="empty">No hay ventas aprobadas de telemarketing en este periodo.</div>`}</div>`; }
/* Plan de comisiones: el general de Dirección, o el propio del distribuidor para SUS telemarketers */
const planTeleDe = up => up ? {sueldo:0, pct:0, liderPct:0, ...(S.members[up]?.planTele||{})} : com();
function commissions(r, up=""){
  const c = planTeleDe(up); const teles = [...byRole("tele"), ...byRole("baja").filter(t => t.prevRole==="tele" && (t.leftAt||0) >= r[0])].filter(t => (t.upline||"")===up);
  /* la comisión se paga sobre ventas aprobadas */
  const rows = teles.map(t => { const e = teleEval(t.id, r); return {t, monto:e.montoAprob, ventas:e.aprob, pend:e.pend, cancel:e.cancel}; });
  const teamMonto = rows.reduce((s,x)=>s+x.monto,0);
  /* Plan propio por persona (ej. Francelis: sin sueldo, 3%); si no tiene, usa el plan general */
  return rows.map(x => { const pct = (x.t.pct ?? "") === "" ? c.pct : +x.t.pct; const base = (x.t.sueldo ?? "") === "" ? c.sueldo : +x.t.sueldo;
    const own = x.monto * pct/100; const lead = x.t.lider ? (teamMonto - x.monto) * c.liderPct/100 : 0; /* la líder no cobra el 1% sobre sus propias ventas */
    const sd = sueldoDe(x.t, r, base);
    return {...x, pct, base, sueldo:sd.sueldo, dias:sd.dias, diasMes:sd.total, own, lead, comision:own+lead, total:sd.sueldo+own+lead}; });
}

/* Evaluación del socio: citas que TUVO en el periodo (por fecha de la cita), no las que se agendaron */
/* Origen de la cita: telemarketing, propia del socio, o Dirección/otro */
function origenDe(a){ const t = S.members[a.teleId]; if (a.teleCredit || a.origen==="tm" || (t && (t.role==="tele" || t.prevRole==="tele"))) return "tm";
  if (a.transferredFrom && a.transferredFrom!==a.socioId) return "asig"; return (a.agendo||a.teleId)===a.socioId ? "propia" : "asig"; }
/* Quién le dio la cita al socio (telemarketer, quien se la transfirió o quien la agendó) */
function dadorDe(a){ const o = origenDe(a); return o==="tm" ? a.teleId : o==="asig" ? (a.transferredFrom && a.transferredFrom!==a.socioId ? a.transferredFrom : (a.agendo||a.teleId)) : a.socioId; }
function origenTxt(a){ const o = origenDe(a); return o==="tm" ? `📞 Telemarketing · ${memberName(a.teleId)}` : o==="asig" ? `🤝 Asignada por ${memberName(dadorDe(a))}` : "🙋 Propia"; }
function socioEval(id, r){
  const ap = Object.values(S.appts).filter(a => a.socioId===id && inR(a.when||0, r));
  const past = ap.filter(a => a.when <= Date.now());
  const demos = past.filter(a => a.status==="hecha"), noHizo = past.filter(a => a.status==="no_se_hizo"), canc = past.filter(a => a.status==="cancelada"), sinRes = past.filter(a => a.status==="agendada");
  const sales = demos.filter(a => a.sale), ventas = sales.filter(a => (a.saleStatus||"pendiente")!=="cancelada"), aprob = sales.filter(a => a.saleStatus==="aprobada");
  const sum = l => l.reduce((t,a)=>t+(+a.amount||0),0);
  return {referidos:allRefs().filter(x => x.socioId===id && inR(x.at, r)).reduce((t,x)=>t+(+x.n||0),0), citas:ap.length, proximas:ap.length-past.length, pasadas:past.length, demos:demos.length, noHizo:noHizo.length, canc:canc.length, sinRes:sinRes.length,
    ventas:ventas.length, aprob:aprob.length, ventCanc:sales.length-ventas.length, monto:sum(ventas), montoAprob:sum(aprob), conRes:past.length-sinRes.length,
    ...["tm","asig","propia"].reduce((o,k) => { const c = ap.filter(a=>origenDe(a)===k), v = ventas.filter(a=>origenDe(a)===k); o["c_"+k]=c.length; o["v_"+k]=v.length; o["m_"+k]=sum(v); return o; }, {}),
    refsDemo: demos.reduce((t,a)=>t+(+a.refsDemo||0),0),
    dadores: ap.filter(a=>origenDe(a)==="asig").reduce((o,a)=>{ const d = dadorDe(a); o[d]=(o[d]||0)+1; return o; }, {})};
}
function socioEvalCard(rg){ return socioTableCard(socios(), rg, "Evaluación de socios", "Distribuidores y emprendedores, según la fecha de cada cita."); }
function socioTableCard(list, rg, title, sub){
  const rows = list.map(s => ({s, e:socioEval(s.id, rg)}));
  const tot = rows.reduce((t,x)=>{ for (const k in x.e) if (k!=="dadores") t[k]=(t[k]||0)+x.e[k]; return t; },{});
  const tr = (n, e, cls="") => `<tr class="${cls}"><td>${n}</td><td class="n">${e.referidos}</td><td class="n">${e.citas}</td><td class="n">${e.demos}</td><td class="n">${e.ventas}</td><td class="n">${e.aprob}</td><td class="n">${money(e.monto)}</td><td class="n">${e.ventas?money(e.monto/e.ventas):"—"}</td><td class="n">${pctHtml(e.ventas,e.demos,40,20)}</td><td class="n">${e.refsDemo||0}<div class="note">${e.demos?(Math.round((e.refsDemo||0)/e.demos*10)/10)+" por casa":"—"}</div></td>${["tm","asig","propia"].map(k=>`<td class="n">${e["v_"+k]||0} <span class="note">· ${money(e["m_"+k]||0)}</span><div class="note">de ${e["c_"+k]||0} citas</div>${k==="asig"&&e.dadores&&Object.keys(e.dadores).length?`<div class="note">${Object.entries(e.dadores).map(([d,n])=>`${esc(memberName(d))} (${n})`).join(", ")}</div>`:""}</td>`).join("")}<td class="n"><b>${e.ventas?Math.round((e.v_tm||0)*100/e.ventas)+"%":"—"}</b></td></tr>`;
  return `<div class="card"><h2>${title} ${periodChips()}</h2><p class="note" style="margin-top:-6px">${sub}</p>
    <div class="tbl-wrap"><table><thead><tr><th>Socio</th><th class="n">Referidos</th><th class="n">Citas</th><th class="n">Demostraciones</th><th class="n">Cant. de ventas</th><th class="n">Ventas aprobadas</th><th class="n">Volumen de ventas</th><th class="n">Venta promedio</th><th class="n">% efectividad demo → venta</th><th class="n">👥 Referidos sacados en demos</th><th class="n">📞 Ventas de telemarketing</th><th class="n">🤝 Ventas de citas asignadas</th><th class="n">🙋 Ventas propias</th><th class="n">% de sus ventas que vienen de telemarketing</th></tr></thead>
    <tbody>${rows.map(x => tr(`${who(x.s.id,28)}${x.s.tipo?`<div class="note">${esc(x.s.tipo)}</div>`:x.s.role==="admin"?`<div class="note">Dirección</div>`:""}`, x.e)).join("")}${rows.length>1?tr("Total", tot, "total"):""}</tbody></table></div>
    <p class="note">Referidos: los que el socio le pasó a las telemarketers para trabajar (los anotan ellas). % efectividad demo → venta: de cada 100 demostraciones, cuántas cerraron en venta. 📞 Ventas de telemarketing: salieron de citas que agendaron las telemarketers. 🤝 Asignadas: citas que le dio otra persona del equipo (Dirección u otro socio), con el nombre de quién se las dio. 🙋 Propias: citas que el socio consiguió por su cuenta.</p></div>`;
}
function evalTable(rows, calls){
  const tot = rows.reduce((t,x)=>{ for (const k in x.e) t[k]=(t[k]||0)+x.e[k]; return t; },{});
  const tr = (n,e,cls="",id) => `<tr class="${cls}"><td>${cls?n:id?`<span class="nm-av">${av(id,26)}<b>${esc(n)}</b></span>`:`<b>${esc(n)}</b>`}</td>${calls?`<td class="n">${e.referidos}</td><td class="n">${e.calls}</td><td class="n">${e.contacts}</td>`:""}<td class="n">${e.citas}</td><td class="n">${e.demos}</td><td class="n">${e.ventas}</td><td class="n">${e.aprob}</td><td class="n">${e.cancel}</td><td class="n">${money(e.monto)}</td>${calls?`<td class="n">${pctHtml(e.citas,e.contacts,30,15)}</td>`:""}<td class="n">${pctHtml(e.demos,e.conRes,60,40)}</td></tr>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Nombre</th>${calls?`<th class="n">Referidos recibidos</th><th class="n">Llamadas</th><th class="n">Contactos</th>`:""}<th class="n">Citas</th><th class="n">Demostraciones</th><th class="n">Cant. de ventas</th><th class="n">Ventas aprobadas</th><th class="n">Ventas canceladas</th><th class="n">Volumen de ventas</th>${calls?`<th class="n">% efectividad contacto → cita</th>`:""}<th class="n">% efectividad cita → demo</th></tr></thead><tbody>${rows.map(x=>tr(x.name,x.e,"",x.id)).join("")}${rows.length>1?tr("Total",tot,"total"):""}</tbody></table></div>`;
}
function rankTele(){

function vigilar(){ if (!S.uid) return; const mine = Object.entries(S.appts||{});
  if (!S.seenIds){ S.seenIds = new Set(mine.map(([id])=>id)); S.seenUnread = unreadTotal(); S.pendNotified = false; }
  else {
    mine.forEach(([id,a]) => { if (!S.seenIds.has(id)){ S.seenIds.add(id); if (a.socioId===S.uid && a.agendo!==S.uid) avisar("📅 Nueva cita", `${cName(a)} · ${fmtWhen(a.when)} · agendó ${memberName(a.agendo||a.teleId)}`); } });
    const u = unreadTotal(); if (u > (S.seenUnread||0)) avisar("💬 Mensaje nuevo en una cita", "Abre Citas para leerlo"); S.seenUnread = u;
  }
  const n = sinReporte().length; if (n && !S.pendNotified){ S.pendNotified = true; avisar("⏰ Citas sin reportar", `Tienes ${n} cita(s) sin resultado. ¿Qué pasó?`); }

/* Territorio: resumen por socio o por telemarketer (hoy, semana, mes) */
function terrResumen(){

  const rows = list.map(m => { const ev = rg => modo==="tele" ? teleEval(m.id, rg) : socioEval(m.id, rg);
    const h = ev(H), w = ev(W), mo = ev(M); return {m, h:h.citas, hd:h.demos, hv:h.ventas, w:w.citas, mo:mo.citas, demos:mo.demos, ventas:mo.ventas, monto:mo.monto}; })

    const pb = () => needAc ? `<label class="f" style="grid-column:1/-1">¿Por cuál distribuidor pasó la venta? <b style="color:var(--bad,#c0392b)">*</b><select class="i" id="ar-paso"><option value="">Escoge…</option>${pasoOpts()}</select></label>` : "";
    const rb = () => `<label class="f">¿Cuántos referidos sacaste en esta casa?<input class="i" type="number" min="0" step="1" id="ar-refs" value="${a.refsDemo??""}" placeholder="0"></label>`;
    const nb = () => a._priv ? `<label class="f" style="grid-column:1/-1">¿Qué pasó con este cliente? (comentario)<textarea class="i" id="ar-note" maxlength="1000" placeholder="Ej: le gustó pero lo quiere hablar con su esposo; tiene ollas viejas…">${esc(a.resNote||"")}</textarea></label>` : "";
    const saveR = async upd => { if (upd.status==="hecha"){ const ac = readAc(); if (ac===null) return; Object.assign(upd, ac); } const rf = $("#ar-refs"); if (rf) upd.refsDemo = Math.max(0, Math.round(+rf.value||0)); else if (upd.status && upd.status!=="hecha") upd.refsDemo = 0; const n = $("#ar-note"); if (n && a._priv){ try { await S.db.doc("apptp/"+id).update({resNote:n.value.trim()}); } catch(e){ writeErr(e); return; } }
      { const cur = S.appts[id] || a; if (cur._priv && cur.phone) histAdd(cur.socioId, cur.phone, cur.client, histEntry({...cur, ...upd, id}, {note: n ? n.value.trim() : (cur.resNote||"")}), [cur.agendo, cur.dador]); }
      save(upd); };
    const LBL = {hecha:"Guardar: demo sin venta", no_se_hizo:"Guardar: no se hizo", cancelada:"Guardar: cancelada"};
    document.querySelectorAll("[data-ar]").forEach(b => b.onclick = () => { const k = b.dataset.ar;
      document.querySelectorAll("[data-ar]").forEach(x => x.classList.toggle("on", x===b));
      if (k==="seguimiento"){ const w = a.segWhen || (Date.now()+2*864e5); $("#ar-extra").innerHTML = `<div class="grid2" style="margin-top:8px"><label class="f">Día del seguimiento<input class="i" type="date" id="sg-d" value="${laDate(w)}"></label><label class="f">Hora${timeSel("sg-t",a.segWhen?laTime(w):"18:00")}</label>${acb()}${rb()}${nb()}<div style="align-self:end"><button class="btn" id="sg-save">Guardar seguimiento</button></div></div>`; bindAc();
        $("#sg-save").onclick = () => { const d=$("#sg-d").value, t=timeVal("sg-t"); if (!d||!t){ toast("Elige el día y la hora"); return; } saveR({status:"hecha", sale:false, amount:0, segWhen:laToMs(d,t), resultAt:Date.now(), resultBy:S.uid}); }; return; }
      if (k==="venta"){ $("#ar-extra").innerHTML = `<div class="grid2" style="margin-top:8px"><label class="f">Monto de la venta (USD)<input class="i" type="number" min="0" step="0.01" id="ar-amt" value="${a.amount||""}"></label>${pb()}${acb()}${rb()}${nb()}<div style="align-self:end"><button class="btn" id="ar-save">Guardar venta</button></div></div>`; bindAc(); $("#ar-amt").focus();
        $("#ar-save").onclick = () => { const amt = +$("#ar-amt").value; if (!(amt>0)){ toast("Escribe el monto de la venta"); return; }

      $("#ar-ok").onclick = () => saveR({status:k, sale:false, amount:0, segWhen:null, resultAt:Date.now(), resultBy:S.uid}); });
    document.querySelectorAll("[data-ss]").forEach(b => b.onclick = () => save({saleStatus:b.dataset.ss, saleStatusAt:Date.now()}));
    $("#fix-priv") && ($("#fix-priv").onclick = () => { const sm = S.members[a.socioId]||{};
      openModal(`<h3>Datos del cliente</h3><div class="grid2"><label class="f">Nombre del cliente<input class="i" id="fx-name"></label><label class="f">Teléfono<input class="i" id="fx-phone" inputmode="tel"></label><label class="f">Ciudad<input class="i" id="fx-city"></label><label class="f">Dirección<input class="i" id="fx-addr"></label><label class="f" style="grid-column:1/-1">Notas<textarea class="i" id="fx-notes"></textarea></label></div><div class="row"><button class="btn" id="fx-save">Guardar</button><button class="btn ghost" data-close>Cancelar</button></div>`, () => {
        $("#fx-save").onclick = async () => { const n = $("#fx-name").value.trim(); if (!n){ toast("Escribe el nombre del cliente"); return; }
          try { await S.db.doc("apptp/"+id).set({client:n, phone:$("#fx-phone").value.trim(), city:$("#fx-city").value.trim(), address:$("#fx-addr").value.trim(), notes:$("#fx-notes").value.trim(), socioId:a.socioId, teleId:a.agendo, dir: sm.tipo !== DIST && !sm.upline, up: sm.upline || "", createdAt:a.createdAt||Date.now()}); closeModal(); toast("Datos guardados"); setTimeout(()=>openAppt(id), 500); } catch(e){ writeErr(e); } }; }); });
    $("#lc-save") && ($("#lc-save").onclick = () => { const v = $("#lc-sel").value; save({teleCredit: v===a.agendo ? null : v, origen:"tm"}); });
    $("#ap-cli") && ($("#ap-cli").onclick = () => openModal(`<h3>Datos del cliente</h3><div class="grid2"><label class="f">Nombre del cliente<input class="i" id="ec-name" value="${esc(a.client||"")}"></label><label class="f">Teléfono<input class="i" id="ec-phone" inputmode="tel" value="${esc(a.phone||"")}"></label><label class="f">Ciudad<input class="i" id="ec-city" value="${esc(a.city||"")}"></label><label class="f">Dirección<input class="i" id="ec-addr" value="${esc(a.address||"")}"></label><label class="f" style="grid-column:1/-1">Notas<textarea class="i" id="ec-notes">${esc(a.notes||"")}</textarea></label></div><div class="row"><button class="btn" id="ec-save">Guardar</button><button class="btn ghost" id="ec-back">Cancelar</button></div>`, () => {
      $("#ec-back").onclick = () => openAppt(id);
      $("#ec-save").onclick = async () => { const n = $("#ec-name").value.trim(); if (!n){ toast("Escribe el nombre del cliente"); return; }
        try { await S.db.doc("apptp/"+id).update({client:n, phone:$("#ec-phone").value.trim(), city:$("#ec-city").value.trim(), address:$("#ec-addr").value.trim(), notes:$("#ec-notes").value.trim()}); toast("Datos guardados"); setTimeout(() => openAppt(id), 400); } catch(e){ writeErr(e); } }; }));
    $("#cr-save") && ($("#cr-save").onclick = () => { const v = $("#cr-sel").value; save({teleCredit: v || null, origen: v ? "tm" : (a.agendo===a.socioId ? "propia" : "dir")}); });
    $("#tr-go") && ($("#tr-go").onclick = function(){ const to = $("#tr-to").value; if (!to){ toast("Elige a quién transferir la cita"); return; }
      if (!this.dataset.sure){ this.dataset.sure="1"; this.textContent = "Toca otra vez para pasarla a "+memberName(to); this.classList.add("danger"); return; }
      if (sponsorDe(to)){ chain("appt:"+id, () => pedirTransfer(id, to)).then(() => { closeModal(); toast(`Le pedimos permiso a ${memberName(sponsorDe(to))}. Cuando apruebe, la cita pasa sola a ${memberName(to)}.`); }, writeErr); return; }
      chain("appt:"+id, () => transferAppt(id, to)).then(() => { closeModal(); toast("Cita transferida a "+memberName(to)); }, writeErr); });
    $("#ap-move") &&($("#ap-move").onclick = () => { const d=$("#ap-date").value, t=timeVal("ap-time"); if (d&&t) save({when:laToMs(d,t), status:"agendada", sale:false, amount:0}); });
    $("#ap-del") && ($("#ap-del").onclick = function(){ if (this.dataset.sure){ chain("appt:"+id, async () => { await S.db.doc("apptp/"+id).delete().catch(()=>{}); await S.db.doc("appts/"+id).delete(); }).then(()=>{ closeModal(); toast("Cita borrada"); }, writeErr); } else { this.dataset.sure="1"; this.textContent="Toca otra vez para borrar"; this.classList.add("danger"); } });
  });
}

/* ===== PAGOS (directora) ===== */
function viewPagos(){
  const p = ["semana","quin","quinant","mes","mesant"].includes(S.f.period) ? S.f.period : "mes"; const rg = range(p);
  const sales = Object.entries(S.appts).filter(([,a]) => a.sale && inR(a.when||0, rg)).sort((a,b)=>a[1].when-b[1].when);
  const live = sales.filter(([,a]) => (a.saleStatus||"pendiente")!=="cancelada");
  const total = live.reduce((s,[,a])=>s+(+a.amount||0),0);
  const aprob = sales.filter(([,a]) => a.saleStatus==="aprobada"); const tAprob = aprob.reduce((s,[,a])=>s+(+a.amount||0),0);
  let h = `<div class="card"><h2>Ventas del territorio ${periodChips(["semana","quin","quinant","mes","mesant"])}</h2><div class="tiles"><div class="tile"><b>${live.length}</b><span>Cantidad de ventas</span><small>${sales.length-live.length} canceladas</small></div><div class="tile"><b>${aprob.length}</b><span>Ventas aprobadas</span><small>${money(tAprob)}</small></div><div class="tile"><b>${live.length-aprob.length}</b><span>Pendientes de aprobación</span></div><div class="tile acc"><b>${money(total)}</b><span>Volumen de ventas</span><small>sin canceladas</small></div></div></div>`;
  h += `<div class="card"><h2>Detalle de ventas</h2>${sales.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Socio</th><th>Telemarketer</th><th>Estado</th><th class="n">Monto</th></tr></thead><tbody>${sales.map(([id,a])=>{ const st=a.saleStatus||"pendiente"; return `<tr data-appt="${id}" style="cursor:pointer"><td class="note">${fmt(a.when,{day:"numeric",month:"short"})}</td><td><b>${esc(cName(a))}</b>${a.city?`<div class="note">${esc(a.city)}</div>`:""}</td><td>${esc(memberName(a.socioId))}</td><td>${esc(memberName(a.teleId))}</td><td><span class="tag ${st==="aprobada"?"tg-good":st==="cancelada"?"tg-mute":"tg-warn"}">${SALE_ST[st]}</span></td><td class="n">${money(a.amount)}</td></tr>`; }).join("")}<tr class="total"><td colspan="5">Total sin canceladas</td><td class="n">${money(total)}</td></tr></tbody></table></div><p class="note">Toca una venta para marcarla como aprobada o cancelada.</p>`:`<div class="empty">No hay ventas registradas en este periodo.</div>`}</div>`;
  const ss = socios().map(s => { const e = teleEval(null, rg, s.id); return {s, e}; });
  h += `<div class="card"><h2>Por socio</h2><div class="tbl-wrap"><table><thead><tr><th>Socio</th><th class="n">Citas</th><th class="n">Demostraciones</th><th class="n">Cant. de ventas</th><th class="n">Volumen de ventas</th></tr></thead><tbody>${ss.map(x=>`<tr><td><b>${esc(x.s.name)}</b></td><td class="n">${x.e.citas}</td><td class="n">${x.e.demos}</td><td class="n">${x.e.ventas}</td><td class="n">${money(x.e.monto)}</td></tr>`).join("")}</tbody></table></div></div>`;
  h += comCard(p);
  h += aporteResumen(p) + aporteDetalle(p);
  /* Dirección ve las comisiones de los emprendedores de los dos directores (Katerine y Andrés) */
  h += empPagosCard(S.uid, p) + rutaGrupoCard(S.uid); byRole("admin").filter(m => m.id!==S.uid).forEach(m => { h += empPagosCard(m.id, p); });
  return h;
}
function comCard(p, up=""){
  const c = planTeleDe(up);
  if (p==="semana" || p==="hoy") return `<div class="card"><h2>Comisiones</h2><p class="note">Las comisiones se calculan por mes. Elige “Este mes” o “Mes anterior”.</p></div>`;
  const rows = commissions(range(p), up); const tot = rows.reduce((s,x)=>s+x.total,0);
  const ed = up && up===S.uid ? `<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:8px"><span class="note">Tu plan para tus telemarketers:</span><label class="note">Sueldo $<input class="i" type="number" min="0" data-ptele="sueldo" value="${c.sueldo}" style="width:80px;padding:4px 6px"></label><label class="note">% de sus ventas <input class="i" type="number" min="0" step="0.5" data-ptele="pct" value="${c.pct}" style="width:64px;padding:4px 6px"></label><label class="note">% extra líder <input class="i" type="number" min="0" step="0.5" data-ptele="liderPct" value="${c.liderPct}" style="width:64px;padding:4px 6px"></label></div>
    <div class="tbl-wrap" style="margin-bottom:8px"><table><thead><tr><th>Telemarketer</th><th>Plan propio (opcional)</th></tr></thead><tbody>${grupoDe(S.uid).filter(m=>m.role==="tele").map(t=>`<tr><td><b>${esc(t.name)}</b></td><td><div class="row" style="gap:4px;flex-wrap:nowrap"><label class="note">Sueldo $<input class="i" type="number" min="0" data-plan="${t.id}|sueldo" value="${t.sueldo??""}" placeholder="${c.sueldo}" style="width:72px;padding:4px 6px"></label><label class="note">%<input class="i" type="number" min="0" step="0.5" data-plan="${t.id}|pct" value="${t.pct??""}" placeholder="${c.pct}" style="width:56px;padding:4px 6px"></label><label class="note">Inicio<input class="i" type="date" data-start="${t.id}" value="${startOf(t)}" style="padding:4px 6px"></label></div></td></tr>`).join("")}</tbody></table></div>` : "";
  return `<div class="card"><h2>Comisiones de ${up && up===S.uid ? "mis telemarketers" : "telemarketing"}<span class="note">${PLABEL[p]}</span></h2>${ed}${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Telemarketer</th><th class="n">Ventas aprobadas</th><th class="n">Volumen aprobado</th><th class="n">Pendientes</th><th class="n">Canceladas</th><th class="n">Comisión propia</th><th class="n">${c.liderPct}% líder (de las demás)</th><th class="n">Total comisión</th><th class="n">Sueldo garantizado (aparte)</th><th class="n">Total a pagar</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.t.name)}</b>${x.t.lider?' <span class="tag tg-warn">líder</span>':""}</td><td class="n">${x.ventas}</td><td class="n">${money(x.monto)}</td><td class="n">${x.pend}</td><td class="n">${x.cancel}</td><td class="n">${money(x.own)}<div class="note">${x.pct}% de sus ventas</div></td><td class="n">${x.t.lider?money(x.lead):"—"}</td><td class="n"><b>${money(x.comision)}</b></td><td class="n">${x.base?`${money(x.sueldo)}<div class="note">${x.dias}/${x.diasMes} días</div>`:`—<div class="note">sin sueldo</div>`}</td><td class="n"><b>${money(x.total)}</b></td></tr>`).join("")}<tr class="total"><td colspan="7">Totales</td><td class="n">${money(rows.reduce((s,x)=>s+x.comision,0))}</td><td class="n">${money(rows.reduce((s,x)=>s+x.sueldo,0))}</td><td class="n">${money(tot)}</td></tr></tbody></table></div>
    <p class="note">Plan general: sueldo de ${money(c.sueldo)} al mes, que se va acumulando por cada día laboral (lunes a sábado) desde su fecha de inicio; el mes completo da ${money(c.sueldo)}. Más ${c.pct}% de las ventas aprobadas que salieron de sus citas. La líder suma ${c.liderPct}% de las ventas aprobadas de las demás telemarketers (de las suyas solo cobra su %). La venta cuenta en el mes de la demostración. Quien tiene un plan propio se calcula con su sueldo y su %.</p>`:`<div class="empty">Aún no hay telemarketers aprobadas.</div>`}</div>`;
}
/* ===== RANKING (todos) ===== */
function board(title, list, metrics, sortKey){
  const max = Math.max(1, ...list.map(x => x[sortKey]));
  const medal = i => i===0?"🥇":i===1?"🥈":i===2?"🥉":String(i+1);
  if (!list.length) return `<div class="card"><h2>${title}</h2><div class="empty">Todavía no hay personas en este grupo.</div></div>`;
  return `<div class="card"><h2>${title}</h2><div class="list">${list.map((x,i)=>`<div class="item" style="cursor:default;display:grid;grid-template-columns:minmax(0,1fr);justify-content:stretch;gap:6px;${x.id===S.uid?"outline:2px solid var(--accent)":""}">
    <div class="row" style="justify-content:space-between"><div class="row"><span style="font-family:var(--serif);font-weight:700;font-size:20px;width:30px;text-align:center">${medal(i)}</span><span class="t nm-av">${av(x.id,34)}${esc(x.name)}${x.id===S.uid?' <span class="note">(tú)</span>':""}</span></div><b style="font-family:var(--serif);font-size:20px">${sortKey==="monto"?money(x.monto):x[sortKey]}</b></div>
    <div class="bar" style="margin-top:0"><i style="width:${Math.round(x[sortKey]*100/max)}%"></i></div>
    <div class="row note" style="gap:14px">${metrics.map(([k,l])=>`<span><b style="color:var(--ink)">${k==="monto"?money(x[k]):x[k]}</b> ${l}</span>`).join("")}</div></div>`).join("")}</div></div>`;
}
function viewRanking(){
  const p = ["semana","mes","mesant"].includes(S.f.period) ? S.f.period : "mes"; const rg = range(p);
  const teles = telesLunaya().map(t => { const e = teleEval(t.id, rg); return {id:t.id, name:t.name, citas:e.citas, demos:e.demos, ventas:e.ventas, monto:e.monto}; }).sort((a,b)=>b.monto-a.monto||b.ventas-a.ventas||b.demos-a.demos||b.citas-a.citas);
  const soc = socios().map(s => { const e = socioEval(s.id, rg); return {id:s.id, name:s.name, referidos:e.referidos, citas:e.citas, demos:e.demos, ventas:e.ventas, monto:e.monto}; }).sort((a,b)=>b.monto-a.monto||b.ventas-a.ventas||b.demos-a.demos||b.referidos-a.referidos);
  const since = Date.now() - 30*864e5;
  const feed = Object.values(S.appts).filter(a => a.sale && (a.saleStatus||"pendiente")!=="cancelada" && (a.resultAt||a.when) >= since).sort((a,b)=>(b.resultAt||b.when)-(a.resultAt||a.when)).slice(0,15);
  let h = `<div class="card"><h2>Periodo ${periodChips(["semana","mes","mesant"])}</h2><p class="note" style="margin:-6px 0 0">Se ordena por volumen de ventas. Las comisiones de cada persona son privadas y no salen aquí.</p></div>`;
  h += `<div class="card"><h2>Últimas ventas</h2>${feed.length?`<div class="list">${feed.map(a=>`<div class="item" style="cursor:default"><div><div class="t nm-av">${av(a.socioId,34)}<span>🔥 ${esc(memberName(a.socioId))} vendió ${money(a.amount)}</span></div><div class="m">Cita de ${esc(memberName(a.teleId))}${a.city?" · "+esc(a.city):""}</div></div><span class="note">${fmt(a.resultAt||a.when,{day:"numeric",month:"short"})}</span></div>`).join("")}</div>`:`<div class="empty">Todavía no hay ventas este mes. ¡La primera puede ser la tuya!</div>`}</div>`;
  h += board("Telemarketers", teles, [["citas","citas"],["demos","demostraciones"],["ventas","ventas"]], "monto");
  h += board("Distribuidores y emprendedores", soc, [["referidos","referidos"],["citas","citas"],["demos","demostraciones"],["ventas","ventas"]], "monto");
  return h;
}

}

      ...socios().map(s => { const e = socioEval(s.id, rg); return [s.name, e.referidos, e.citas, e.demos, e.ventas, e.aprob, e.monto, e.ventas?Math.round(e.monto/e.ventas):"", pc(e.ventas,e.demos)]; }), [],

    ["COMISIONES"], ["Telemarketer","Líder","Ventas aprobadas","Volumen aprobado","Sueldo",c.pct+"% propio",c.liderPct+"% líder","Total"], ...cm.map(x => [x.t.name, x.t.lider?"Sí":"", x.ventas, x.monto, x.sueldo, x.own, x.lead, x.total]), ["Total","","","","","","",cm.reduce((s,x)=>s+x.total,0)]];
  csvDownload(`Lunaya-reporte-${laDate(rg[0]+864e5).slice(0,7)}.csv`, rows); gStatus(`Reporte de ${label} descargado.`, "good");
}
const BK_CITAS_HEAD = ["Creada","Fecha cita","Cliente","Teléfono","Ciudad","Dirección","Socio","Telemarketer","Fuente","Estado cita","Venta","Estado venta","Monto","Notas","ID"];
const BK_CALLS_HEAD = ["Fecha","Telemarketer","Socio","Fuente","Total","No contestó","Buzón / apagado","Llamar después","No le interesa","No califica","Cita","Referidos recibidos"];
async function doBackup(kind){
  const d = ms => ms ? fmt(ms,{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
  try {
    if (kind === "citas"){
      const citas = Object.entries(S.appts).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0)).map(([id,a]) => [d(a.createdAt), d(a.when), a.client||"", a.phone||"", a.city||"", a.address||"", memberName(a.socioId), memberName(a.teleId), a.source||"", APPT_ST[a.status]||"", a.sale?"Sí":"No", a.sale?SALE_ST[a.saleStatus||"pendiente"]:"", +a.amount||0, a.notes||"", id]);
      csvDownload(`Lunaya-citas-${today()}.csv`, [BK_CITAS_HEAD, ...citas]); gStatus(`${citas.length} citas descargadas.`, "good");
    } else {
      gStatus("Leyendo todo el historial…");
      const logs = (await S.db.collection("calllog").get()).docs.map(x => x.data());
      const agg = {};
      const slot = (L, x) => { const k = [L.date, L.teleId, x.socioId||"", x.source||""].join("|"); return (agg[k] ||= {date:L.date, tele:L.teleId, socio:x.socioId, src:x.source||"", n:{}, refs:0}); };
      for (const L of logs){ for (const c of (L.calls||[])){ const g = slot(L, c); g.n[c.result] = (g.n[c.result]||0)+1; } for (const r of (L.refs||[])) slot(L, r).refs += (+r.n||0); }
      const calls = Object.values(agg).sort((a,b)=>a.date.localeCompare(b.date)).map(x => [x.date, memberName(x.tele), memberName(x.socio), x.src, Object.values(x.n).reduce((s,v)=>s+v,0), ...RESULTS.map(([k])=>x.n[k]||0), x.refs]);
      csvDownload(`Lunaya-llamadas-${today()}.csv`, [BK_CALLS_HEAD, ...calls]); gStatus(`${calls.length} filas de llamadas descargadas.`, "good");
    }
    await S.db.doc("config/main").set({...S.config, lastBackup:Date.now()});
  } catch(e){ console.log(e); gStatus("No se pudo preparar el respaldo. Intenta de nuevo.", "bad"); }
}

/* ===== Mi perfil: foto ===== */
function loadImg(src){ return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = src; }); }
function openProfile(){
  const m = S.me || {}; let photo = m.photo || ""; let crop = null; /* {img, z, ox, oy} */
  const SZ = 240, OUT = 360;
  openModal(`<h3>Mi perfil</h3><div class="row note" style="margin-top:-6px"><span class="pill acc">${esc(ROLE[role()]||"")}${m.lider?" · líder":""}${m.tipo?" · "+esc(m.tipo):""}</span>${m.joinedAt?`<span>En el equipo desde ${fmt(m.joinedAt,{day:"numeric",month:"long",year:"numeric"})}</span>`:""}</div>
    <div style="display:grid;justify-items:center;gap:10px">
      <div id="pf-stage" style="width:${SZ}px;height:${SZ}px;border-radius:50%;overflow:hidden;background:var(--soft);touch-action:none;cursor:grab;box-shadow:0 0 0 4px var(--accent)">
        <canvas id="pf-cv" width="${OUT}" height="${OUT}" style="width:${SZ}px;height:${SZ}px;display:block"></canvas></div>
      <div id="pf-tools" class="note" hidden style="width:${SZ+40}px;text-align:center">Arrastra la foto para centrar tu cara
        <label class="row" style="justify-content:center;margin-top:6px">− <input type="range" id="pf-zoom" min="1" max="4" step="0.01" value="1" style="flex:1" aria-label="Acercar o alejar"> +</label></div>
      <div class="row" style="justify-content:center"><label class="btn small" style="cursor:pointer">${photo?"Cambiar foto":"Elegir foto"}<input type="file" id="pf-file" accept="image/*" hidden></label>${photo?`<button class="btn small ghost" id="pf-rm">Quitar foto</button>`:""}</div>
    </div>
    <div class="grid2"><label class="f">Nombre<input class="i" id="pf-name" value="${esc(m.name||"")}"></label><label class="f">Teléfono / WhatsApp<input class="i" id="pf-phone" inputmode="tel" value="${esc(m.phone||"")}"></label><label class="f">Correo de contacto<input class="i" id="pf-email" type="email" inputmode="email" value="${esc(m.email||"")}"></label><label class="f" style="grid-column:1/-1">Calendario de Google para mis citas (opcional)<input class="i" id="pf-gcal" value="${esc(m.gcalId||"")}" placeholder="Ej: abc123@group.calendar.google.com"><span class="note">Si lo pones, el botón 📅 guarda las citas directo en ese calendario (por ejemplo "Citas Lunaya").</span></label></div>
    <p class="note" style="margin:0">Entras con: <b>${esc(S.email)}</b> · versión ${APP_VER}</p>
    <div class="row"><button class="btn" id="pf-save">Guardar</button><button class="btn ghost" data-close>Cancelar</button><button class="btn small ghost" id="pf-out" style="margin-left:auto">Cerrar sesión</button></div>`, () => {
    $("#pf-out").onclick = () => { closeModal(); S.auth.signOut(); };
    const cv = $("#pf-cv"), ctx = cv.getContext("2d");
    const draw = () => { ctx.clearRect(0,0,OUT,OUT);
      if (crop){ const {img} = crop; const base = OUT / Math.min(img.width, img.height); const sc = base * crop.z; const w = img.width*sc, h = img.height*sc;
        crop.ox = Math.min(OUT/2, Math.max(OUT/2 - w, crop.ox)); crop.oy = Math.min(OUT/2, Math.max(OUT/2 - h, crop.oy));
        ctx.fillStyle = "#f4ecdd"; ctx.fillRect(0,0,OUT,OUT);
        ctx.drawImage(img, crop.ox, crop.oy, w, h); }
      else if (photo){ loadImg(photo).then(img => { if (!crop) ctx.drawImage(img, 0, 0, OUT, OUT); }); }
      else { ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--accent-soft"); ctx.fillRect(0,0,OUT,OUT); } };
    const startCrop = img => { const base = OUT / Math.min(img.width, img.height);
      crop = {img, z:1, ox:(OUT - img.width*base)/2, oy:(OUT - img.height*base)/2}; $("#pf-zoom").value = 1; $("#pf-tools").hidden = false; draw(); };
    draw();
    $("#pf-file").onchange = e => { const f = e.target.files[0]; if (!f) return; const url = URL.createObjectURL(f);
      loadImg(url).then(startCrop).catch(() => toast("No se pudo leer esa imagen. Prueba con otra foto.")); };
    if (photo) loadImg(photo).then(startCrop).catch(()=>{});
    $("#pf-zoom").oninput = e => { if (!crop) return; const {img} = crop; const base = OUT / Math.min(img.width, img.height);
      const old = base*crop.z, nz = +e.target.value, nw = base*nz; const cx = OUT/2, cy = OUT/2;
      crop.ox = cx - (cx - crop.ox) * nw/old; crop.oy = cy - (cy - crop.oy) * nw/old; crop.z = nz; draw(); };
    let drag = null; const k = OUT / SZ;
    const st = $("#pf-stage");
    st.onpointerdown = e => { if (!crop) return; drag = {x:e.clientX, y:e.clientY, ox:crop.ox, oy:crop.oy}; st.setPointerCapture(e.pointerId); st.style.cursor = "grabbing"; };
    st.onpointermove = e => { if (!drag) return; crop.ox = drag.ox + (e.clientX-drag.x)*k; crop.oy = drag.oy + (e.clientY-drag.y)*k; draw(); };
    st.onpointerup = st.onpointercancel = () => { drag = null; st.style.cursor = "grab"; };
    $("#pf-rm") && ($("#pf-rm").onclick = () => { photo = ""; crop = null; $("#pf-tools").hidden = true; draw(); });
    $("#pf-save").onclick = async () => { const name = $("#pf-name").value.trim(); if (!name){ toast("Escribe tu nombre"); return; }
      let out = photo; if (crop){ const c2 = document.createElement("canvas"); c2.width = c2.height = 240; c2.getContext("2d").drawImage(cv, 0, 0, 240, 240); out = c2.toDataURL("image/jpeg", 0.85); }
      try { $("#pf-save").disabled = true; await S.db.doc("members/"+S.uid).update({name, phone:$("#pf-phone").value.trim(), email:$("#pf-email").value.trim(), photo:out, gcalId:($("#pf-gcal")?.value||"").trim()}); closeModal(); toast("Perfil guardado"); } catch(e){ $("#pf-save").disabled = false; writeErr(e); } };
  });
}

  all("[data-embdet]", b => b.onclick = () => openEmbDet(b.dataset.embdet));
  all("[data-start]", s => s.onchange = async () => { if (!s.value) return; try { await S.db.doc("members/"+s.dataset.start).update({startDate:s.value}); toast("Fecha de inicio guardada"); } catch(e){ writeErr(e); } });
  all("[data-setrole]", s => s.onchange = async () => { const id = s.dataset.setrole; try { if (s.value==="fuera"){ const m = S.members[id]||{}; if (m.role==="tele") await S.db.doc("members/"+id).update({role:"baja", prevRole:"tele", lider:false, leftAt:Date.now()}); else await S.db.doc("members/"+id).delete(); } else await S.db.doc("members/"+id).update({role:s.value}); toast(s.value==="fuera"?"Acceso quitado":"Rol actualizado"); } catch(e){ writeErr(e); } });
  all("[data-lider]", c => c.onchange = async () => { try { await S.db.doc("members/"+c.dataset.lider).update({lider:c.checked}); toast(c.checked?"Marcada como líder":"Ya no es líder"); } catch(e){ writeErr(e); } });
  all("[data-rename]", b => b.onclick = () => { const id = b.dataset.rename; openModal(`<h3>Renombrar</h3><input class="i" id="rn" value="${esc(S.members[id]?.name||"")}"><div class="row"><button class="btn" id="rn-s">Guardar</button><button class="btn ghost" data-close>Cancelar</button></div>`, () => { $("#rn-s").onclick = async () => { const n = $("#rn").value.trim(); if (!n) return; try { await S.db.doc("members/"+id).update({name:n}); closeModal(); } catch(e){ writeErr(e); } }; }); });
}

boot();
</script>
</body>
</html>
