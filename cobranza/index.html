<style>

<script>
if (window.top !== window.self) document.documentElement.classList.add("framed");
/* Cobranza v2. Cuentas en ccli (lo que ya había). Actividad en ccli/{id}/act.
   Órdenes de postventa en cpost. Pedidos de link en clinkreq. Pagos anotados en cpagos.
   Tarjetas en ctarjetas: solo Katerine y quien ella marque en cconfig/main.tarjetas.
   El bot crea y actualiza; no borra y no ve tarjetas. No se guarda el CVV. */
const L = window.Cobranza;
const TZ = "America/Los_Angeles";
const GRUPOS = {aldia:"Al día", g30:"0–30", g60:"31–60", g90:"61+"};
const ROLES = {g30:"Cobra 0–30", g60:"Cobra 31–60", g90:"Recompra (61+)", post:"Postventa", direccion:"Dirección"};
const MENU = [["g30","0-30","#2f6f73"],["g60","31-60","#b8862f"],["g90","61+","#8d2b3b"],["post","Postventa","#c45b78"],["pagos","Pagos/Actividad","#1d5f99"],["hoy","Hoy","#3f7d4e"],["agenda","Agenda","#6d28d9"],["ajustes","Equipo","#5b1424"]];
const ICO = {
  g30:'<rect x="3.5" y="5" width="17" height="15.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3.5v4M16 3.5v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  g60:'<circle cx="12" cy="13" r="7.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 13V9.2M12 13l3 2M9 3.2h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  g90:'<path d="M12 3.5 21.5 20h-19L12 3.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1" fill="currentColor"/>',
  post:'<path d="M3.5 8 12 4l8.5 4L12 12 3.5 8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3.5 8v8L12 20l8.5-4V8M12 12v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  pagos:'<rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  hoy:'<circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.2M12 19v2.2M2.8 12h2.2M19 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  agenda:'<rect x="4" y="4" width="16" height="16.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v3M16 3v3M4 9h16M8 13.2l1.6 1.6L12.5 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  ajustes:'<circle cx="9" cy="9" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="10.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 18.5c.6-2.4 2.4-3.6 4.5-3.6s3.9 1.2 4.5 3.6M13.2 18.5c.4-1.7 1.5-2.6 2.8-2.6 1.2 0 2.2.8 2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
};
const TIPOS = {llamada:"Llamada", whatsapp:"WhatsApp", sms:"SMS", correo:"Correo", nota:"Nota"};
const OUTS = {contesto:"Contestó", no:"No contestó", buzon:"Buzón", promesa:"Promesa de pago", pago:"Pagó", equivocado:"Número equivocado"};
const RES_OLD = {nc:"No contestó", promesa:"Promesa de pago", pago:"Pagó", otro_dia:"Que llame otro día", solo_kat:"Solo habla con Katerine", mal:"Número equivocado", nota:"Nota"};
const METODOS = {cheque:"Cheque", sitio:"Sitio web", llamada:"Llamada", tarjeta:"Tarjeta en archivo", link:"Link de Hy Cite", otro:"Otro"};
const METODO_AUTO = {cheque:"Cheque", sitio:"Sitio web", llamada:"Llamada", tarjeta:"Tarjeta en archivo"};
const SKIP_TXT = "En skip: Hy Cite tiene bloqueados pagos y links. Objetivo: que el cliente llame a Hy Cite para quitar el skip.";
const AGENDA_TIPO = {llamar:"Llamar", ir:"Ir por pago", entrega:"Confirmar entrega", otro:"Otro"};
const S = {db:null, auth:null, user:null, uid:"", email:"", owners:[], cfg:{}, me:null, meLoaded:false, cfgLoaded:false, cli:{}, acts:{}, actsReady:false, pagos:{}, post:{}, links:{}, cards:{}, autos:{}, agenda:{}, revs:{}, drive:"", agWhen:"hoy", agWho:"", members:{}, membersLoaded:false, ventas:{}, privs:{}, view:"g30", f:{q:"", cob:"", tono:"", mios:false}, per:"hoy", loaded:false, unsub:[], tarDraft:null, reveal:{}};

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tel10 = t => { const d = String(t||"").replace(/\D/g,""); return d.length===11 && d[0]==="1" ? d.slice(1) : (d.length>=10 ? d.slice(-10) : d); };
const telFmt = t => { const d = tel10(t); return d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (t||""); };
function partsLA(ms){ const o = {}; new Intl.DateTimeFormat("en-US",{timeZone:TZ,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date(ms)).forEach(p => o[p.type] = p.value); return o; }
function tzOff(ms){ const p = partsLA(ms); return Date.UTC(+p.year, +p.month-1, +p.day, +p.hour%24, +p.minute, +p.second) - Math.floor(ms/1000)*1000; }
function laToMs(d, t){ const [y,m,da] = String(d||"").split("-").map(Number); if (!y) return 0; const [h,mi] = (t||"00:00").split(":").map(Number); const g = Date.UTC(y,m-1,da,h||0,mi||0); return g - tzOff(g - tzOff(g)); }
const laDate = ms => { const p = partsLA(ms); return `${p.year}-${p.month}-${p.day}`; };
const today = () => laDate(Date.now());
function addDays(d, n){ const [y,m,da] = d.split("-").map(Number); return new Date(Date.UTC(y,m-1,da+n,12)).toISOString().slice(0,10); }
const fmt = (ms, o) => ms ? new Intl.DateTimeFormat("es-US",{timeZone:TZ,...o}).format(new Date(ms)) : "";
const fmtWhen = ms => fmt(ms,{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
function mondayOf(d){ const [y,m,da] = d.split("-").map(Number); const dow = (new Date(Date.UTC(y,m-1,da,12)).getUTCDay()+6)%7; return addDays(d,-dow); }
function rango(p){ const t = today(); if (p==="hoy") return [laToMs(t,"00:00"), laToMs(addDays(t,1),"00:00")];
  if (p==="semana"){ const mo = mondayOf(t); return [laToMs(mo,"00:00"), laToMs(addDays(mo,7),"00:00")]; }
  const f = t.slice(0,8)+"01"; const [y,m] = f.split("-").map(Number); const nx = new Date(Date.UTC(y,m,1,12)).toISOString().slice(0,10); return [laToMs(f,"00:00"), laToMs(nx,"00:00")]; }
const inR = (ms, r) => ms >= r[0] && ms < r[1];
function toast(m){ document.querySelectorAll(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function err(e){ console.log(e); toast(e && e.code==="permission-denied" ? "Sin permiso. Si acabas de actualizar, Katerine todavía tiene que pegar las reglas nuevas en Firebase." : "No se pudo guardar. Revisa tu conexión."); }
function openModal(html, bind){ $("#modal").innerHTML = `<div class="mbg" id="mbg"><div class="modal">${html}</div></div>`; $("#mbg").onclick = e => { if (e.target.id==="mbg") closeModal(); }; $("#modal").querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal); bind && bind(); }
function closeModal(){ $("#modal").innerHTML = ""; S.open = null; }
const qv = id => { const n = document.getElementById(id); return n ? n.value : ""; };

const staff = () => S.cfg.staff || {};
const isOwner = () => S.owners.includes(S.email);
const isBot = () => S.me?.role === "bot" && !S.me?.bloqueado;
const isDir = () => isOwner() || isBot() || (staff()[S.email]?.roles||[]).includes("direccion");
const canEnter = () => isOwner() || isBot() || !!staff()[S.email];
const veTarjetas = () => !isBot() && (isOwner() || (S.cfg.tarjetas||[]).includes(S.uid));
const nameOf = em => em ? (staff()[em]?.name || (S.owners.includes(em) ? "Katerine" : String(em).split("@")[0])) : "—";
const first = n => String(n||"").trim().split(/\s+/)[0];
const money = n => "$" + (+n||0).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
const conRol = r => Object.entries(staff()).filter(([,v]) => (v.roles||[]).includes(r)).map(([em]) => em);
const bucketOf = c => L.bucketOf(c.atraso);
const vencidoDe = c => (c.vencido != null && c.vencido !== "") ? (+c.vencido||0) : (+c.saldo||0);
const mensualDe = c => (c.mensual != null && c.mensual !== "") ? (+c.mensual||0) : (+(c.pago&&c.pago.monto)||0);
const encargada = c => c.asignada || (conRol(bucketOf(c))[0] || "");
const finDia = () => laToMs(addDays(today(),1), "00:00");
const ym = () => today().slice(0,7);
const diaHoy = () => +today().slice(8,10);
const ultimoDia = () => { const [y,m] = today().split("-").map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
const pagaHoy = c => c.pago?.dia && c.etapa!=="cerrado" && (Math.min(+c.pago.dia, ultimoDia()) === diaHoy()) && !(c.revis||{})[ym()];
const esMio = c => isDir() ? true : (encargada(c)===S.email || (c.etapa==="postventa" && (staff()[S.email]?.roles||[]).includes("post")));
const postFalta = c => [!c.post?.llamada && "Llamada de bienvenida", !c.post?.visita?.hecha && "Visita de entrega", !c.pago?.dia && "Pagos automáticos"].filter(Boolean);
function streakNo(id, c){
  const items = [];
  (S.acts[id]||[]).forEach(a => items.push({at:a.at||0, no:a.resultado==="no"||a.resultado==="buzon", hit:["contesto","promesa","pago","equivocado"].includes(a.resultado)}));
  (c.log||[]).forEach(x => items.push({at:x.at||0, no:x.res==="nc", hit:["promesa","pago","mal","contesto"].includes(x.res)}));
  if (!items.length) return +c.sinContestar||0;
  items.sort((a,b)=>a.at-b.at); let n = 0;
  items.forEach(x => { if (x.hit) n = 0; else if (x.no) n++; });
  return n;
}
const tono = (id,c) => L.toneOf({...c, sinContestar:streakNo(id,c)});
/* Color de la línea de la tarjeta: por días de atraso (0–30 amarillo, 31+ rojo); skip morado y update azul aparte */
const linea = c => L.esSkip(c) ? "morado" : (L.esUpdate(c) && !L.updateAprobado(c)) ? "azul" : (c.etapa==="cerrado" || (+c.atraso||0) <= 0) ? "verde" : (+c.atraso||0) <= 30 ? "amarillo" : "rojo";
function llamadasDe(id,c){ const legacy = (c.log||[]).filter(x => x.res && x.res!=="nota").length; if (S.actsReady) return (S.acts[id]||[]).filter(a => a.tipo==="llamada").length + legacy; return (+c.llamadas||0) + legacy; }
function ultimoDe(id,c){ const t = [c.ultContacto||0, c.ultLlamada||0]; (S.acts[id]||[]).forEach(a => t.push(a.at||0)); (c.log||[]).forEach(x => t.push(x.at||0)); return Math.max(0,...t); }
function touch(o){ o.updatedAt = Date.now(); if (isBot()){ o.lastSyncAt = Date.now(); o.syncedBy = S.email; } return o; }
function semanaDe(fecha){ if (!fecha) return ""; const t = today(); if (fecha===t) return "hoy"; if (fecha<t) return "pasada"; const mo = mondayOf(t); if (fecha>=mo && fecha<=addDays(mo,6)) return "semana"; return "luego"; }

function boot(){

    [["socioId",uid],["up",uid],["dueno",uid],["dador",uid],["teleId",uid]].forEach(([f,v]) => S.unsub.push(S.db.collection("apptp").where(f,"==",v).onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); S.privs[f] = m; render(); }, e => console.log("apptp", f, e)))); }
}
const priv = id => { for (const k in S.privs){ if (S.privs[k][id]) return S.privs[k][id]; } return null; };
const puedeVendedor = () => !isBot() && (isOwner() || S.me?.role==="admin");
function memberNom(uid){ if (!uid) return ""; const m = S.members[uid]; if (m && m.name) return String(m.name).trim(); if (uid===S.uid && isOwner()) return "Katerine"; return ""; }
function nombreVenta(id, a, p){ a = a || S.ventas[id] || {}; p = p || priv(id) || {}; return L.nombreCompleto(Object.assign({}, a, p)) || "Cliente"; }
function nombreDe(c){ if (!c) return ""; let n = L.nombreCompleto(c); if (c.apptId) n = L.nombreMasLargo(n, nombreVenta(c.apptId)); return n; }
function vendedorDe(c){ if (!c) return {id:"", nombre:""}; if (c.vendedorNombre || c.vendedorId) return {id:c.vendedorId||"", nombre:c.vendedorNombre || memberNom(c.vendedorId)}; const a = c.apptId && S.ventas[c.apptId]; if (a && a.socioId) return {id:a.socioId, nombre:memberNom(a.socioId)}; return {id:"", nombre:""}; }
function vendTxt(c){ const n = vendedorDe(c).nombre; return n ? "Vendedor: "+n : ""; }
function optsVend(sel){ const rol = m => m.role==="admin"?"Dirección":m.role==="tele"?"Telemarketing":m.role==="socio"?"Socio":m.role==="bot"?"Bot":(m.role||"");
  const gente = Object.entries(S.members).filter(([,m]) => m && m.role!=="baja" && m.role!=="pendiente").sort((a,b) => String(a[1].name||"").localeCompare(String(b[1].name||""), "es"));
  let h = `<option value="">Sin vendedor</option>`+gente.map(([id,m]) => `<option value="${esc(id)}" ${sel===id?"selected":""}>${esc(m.name||"Sin nombre")} · ${rol(m)}</option>`).join("");
  if (sel && !S.members[sel]) h += `<option value="${esc(sel)}" selected>${esc(memberNom(sel)||sel)}</option>`;
  return h; }
function completarDesdeVenta(){ if (!isOwner() || !S.db || !S.loaded) return;
  Object.entries(S.cli).forEach(([id,c]) => { if (S.relleno && S.relleno[id]) return; const a = c.apptId && S.ventas[c.apptId]; if (!a && !(c.apptId && priv(c.apptId))) return;
    const mejor = L.nombreMasLargo(String(c.nombre||"").trim(), nombreVenta(c.apptId));
    const vid = (a && a.socioId) || ""; const vnom = memberNom(vid);
    const faltaVend = !c.vendedorId && !c.vendedorNombre && !!vid;
    if (faltaVend && !vnom && !S.membersLoaded) return;
    const up = {}; if (mejor && mejor !== String(c.nombre||"").trim()) up.nombre = mejor.slice(0,120);
    if (faltaVend && vnom){ up.vendedorId = vid; up.vendedorNombre = vnom.slice(0,80); }
    (S.relleno = S.relleno || {})[id] = 1; if (!Object.keys(up).length) return;
    S.db.doc("ccli/"+id).update(up).catch(e => { delete S.relleno[id]; console.log("vendedor", e); }); }); }
const ventasNuevas = () => { const ya = new Set(Object.values(S.cli).map(c => c.apptId).filter(Boolean)); const desde = Date.now() - 120*864e5;
  return Object.entries(S.ventas).filter(([id,a]) => a.sale && !ya.has(id) && !a.cobOff && (a.saleStatusAt || a.when || 0) >= desde).sort((x,y) => (y[1].saleStatusAt||y[1].when||0) - (x[1].saleStatusAt||x[1].when||0)); };

function pasaQuery(c){ const q = (S.f.q||"").trim().toLowerCase(); if (!q) return true; const qd = q.replace(/\D/g,"");
  const blob = (nombreDe(c)+" "+(c.apellido||"")+" "+(c.vendedorNombre||"")).toLowerCase();
  return blob.includes(q) || String(c.cuenta||"").toLowerCase().includes(q) || String(c.email||"").toLowerCase().includes(q) || String(c.producto||"").toLowerCase().includes(q) || (qd.length>=3 && tel10(c.tel).includes(qd)); }
function pasaFiltro(id,c){
  if (S.f.mios && !esMio(c)) return false;
  const who = encargada(c);
  if (S.f.cob==="sin" && who) return false;
  if (S.f.cob && S.f.cob!=="sin" && who!==S.f.cob && c.asignada!==S.f.cob) return false;
  const t = tono(id,c);
  if (S.f.tono==="skip" && t!=="rojo") return false;
  if (S.f.tono==="update" && !L.esUpdate(c)) return false;
  if (S.f.tono==="promesa" && t!=="amarillo") return false;
  if (S.f.tono==="no" && streakNo(id,c)<3) return false;
  if (S.f.tono==="verde" && t!=="verde") return false;
  return pasaQuery(c);
}
function enBucket(c,g){ return c.etapa!=="cerrado" && bucketOf(c)===g; }
const countB = g => Object.values(S.cli).filter(c => enBucket(c,g)).length;
function tabCount(k){
  if (k==="g30"||k==="g60"||k==="g90") return countB(k);
  if (k==="post") return Object.keys(S.post).length;
  if (k==="hoy"){ let n = 0; Object.values(S.cli).forEach(c => { if (!esMio(c)) return; if (pagaHoy(c)) n++; if (c.etapa!=="cerrado" && ((c.prox && c.prox < finDia()) || (c.promesa?.fecha && !c.promesa.ok && c.promesa.fecha <= today()))) n++; }); return n; }
  if (k==="agenda"){ const t = today(); let n = Object.values(S.agenda).filter(a => a.fecha===t && a.estado!=="hecho").length; Object.entries(S.autos).forEach(([id,a]) => { if (L.revisionFecha(a, t)===t && !(S.revs[id+"_"+t])) n++; }); return n; }
  if (k==="ajustes") return Object.keys(staff()).length;
  return null;
}

function vPagos(){

  const pays = Object.values(S.pagos).filter(p => inR(p.at||laToMs(p.fecha,"12:00"), r)).sort((a,b) => (b.at||0)-(a.at||0));
  const gente = Object.keys(staff());
  if (isOwner() && !gente.includes(S.email)) gente.unshift(S.email);
  const deQuien = (email, a) => { const q = String(a.quien||"").toLowerCase(); const nm = String(staff()[email]?.name||"").toLowerCase(); if (q && (q===email || (nm && (q===nm || q.startsWith(nm.split(" ")[0]))))) return true; return !q && String(a.by||"").toLowerCase()===email; };
  const dias = []; for (let d = laDate(r[0]), i=0; d < laDate(r[1]) && i<31; d = addDays(d,1), i++) dias.push(d);

      ${pend.length?`<div class="list">${pend.map(x => { const c = S.cli[x.clientId]||{}; const vn = vendTxt(c); return `<div class="item ${L.esSkip(c)?"rojo":"normal"}" style="cursor:default;flex-wrap:wrap"><div style="flex:1;min-width:180px"><div class="t">${esc(nombreDe(c)||x.nombre||"Cliente")}</div><div class="m">${vn?esc(vn)+" · ":""}Pedido ${x.askedAt?fmtWhen(x.askedAt):""} · ${esc(nameOf(x.askedBy))}${L.esSkip(c)?" · en skip":""}</div></div>${puedeLlenar?`<div class="row"><input class="i" data-url="${esc(x.id)}" placeholder="https://…" style="min-width:180px"><button class="btn small" data-lista="${esc(x.id)}">Marcar lista</button></div>`:`<span class="tag tg-warn">Pendiente</span>`}</div>`; }).join("")}</div>`:`<div class="empty">No hay pedidos de link.</div>`}</div>

function notasTarjeta(){
  if (!S.membersLoaded) return {sel:[], notes:["Cargando personas de Lunaya…"], saved:Array.isArray(S.cfg.tarjetas)};
  const sug = L.sugerirTarjetas(S.members);
  const saved = Array.isArray(S.cfg.tarjetas);
  const notes = [];
  if (!saved) notes.push.apply(notes, sug.notes);
  if (!saved && sug.uids.length && !sug.notes.length) notes.unshift("Arisbel y Milady salen marcadas solo como sugerencia. Toca Guardar para darles acceso. Puedes quitar o agregar a quien quieras.");
  else if (!saved && sug.uids.length) notes.unshift("Marqué a quien sí encontré. Revisa y toca Guardar. Puedes cambiar la lista.");
  if (!saved && !sug.uids.length) notes.unshift("No marqué a nadie. Cuando Arisbel y Milady estén en Lunaya, salen marcadas para que tú confirmes.");
  const staffN = Object.values(staff()).map(v => String(v.name||"").toLowerCase());
  ["arisbel","milady"].forEach(p => {
    const marcada = (saved ? S.cfg.tarjetas : (S.tarDraft || sug.uids)).some(id => String(S.members[id]?.name||"").toLowerCase().includes(p) || String(S.members[id]?.email||"").toLowerCase().includes(p));
    if (!marcada && staffN.some(n => n.includes(p))) notes.push(p[0].toUpperCase()+p.slice(1)+" está en el equipo de cobranza, pero no hallé su usuario de Lunaya (hace falta para la lista de tarjetas).");
  });
  const sel = saved ? S.cfg.tarjetas.slice() : (S.tarDraft ? S.tarDraft.slice() : sug.uids.slice());
  return {sel, notes, saved};
}

async function logAct(clientId, partial){
  const c = S.cli[clientId]||{};
  const act = {by:S.email, quien:partial.quien||S.email, byName:nameOf(partial.quien||S.email), at:partial.at||Date.now(), tipo:partial.tipo||"nota", resultado:partial.resultado||"", mensaje:String(partial.mensaje||"").slice(0,2000), clientId};
  if (partial.promesaFecha) act.promesaFecha = partial.promesaFecha;
  if (partial.promesaMonto) act.promesaMonto = +partial.promesaMonto||0;
  const up = touch({ultContacto:act.at, contactos:firebase.firestore.FieldValue.increment(1)});
  if (act.tipo==="llamada"){ up.llamadas = firebase.firestore.FieldValue.increment(1); up.ultLlamada = act.at; }
  const no = act.resultado==="no" || act.resultado==="buzon";
  const hit = ["contesto","promesa","pago","equivocado"].includes(act.resultado);
  if (hit) up.sinContestar = 0; else if (no) up.sinContestar = firebase.firestore.FieldValue.increment(1);
  if (act.resultado==="promesa" && act.promesaFecha){ up.promesa = {fecha:act.promesaFecha, monto:act.promesaMonto||0, at:act.at, ok:false}; up.prox = laToMs(act.promesaFecha,"10:00"); }
  if (act.resultado==="pago" && c.promesa) up.promesa = Object.assign({}, c.promesa, {ok:true, okAt:act.at});
  const nextSin = hit ? 0 : (+c.sinContestar||0) + (no?1:0);
  up.tono = L.toneOf(Object.assign({}, c, {sinContestar:nextSin}));
  const batch = S.db.batch();
  batch.set(S.db.collection("ccli").doc(clientId).collection("act").doc(), act);
  batch.update(S.db.doc("ccli/"+clientId), up);
  await batch.commit();
}

  else { if (tel.length!==10) return toast("El teléfono no está completo.");
    if (tipo==="llamada") url = "tel:+1"+tel;
    else if (tipo==="whatsapp") url = "https://wa.me/1"+tel+"?text="+body;
    else url = "sms:+1"+tel+"?&body="+body; }
  const nombre = {llamada:"Llamar", sms:"Mensaje de texto", whatsapp:"WhatsApp", correo:"Correo electrónico"}[tipo] || tipo;

function resolverCobrador(raw){

}
function findCli(row){
  const list = Object.entries(S.cli);
  const cuenta = String(row.cuenta||"").trim().toLowerCase();
  if (cuenta){ const hit = list.find(([,c]) => String(c.cuenta||"").trim().toLowerCase()===cuenta); if (hit) return hit; }
  const tel = tel10(row.tel); if (tel.length===10){ const hit = list.find(([,c]) => tel10(c.tel)===tel); if (hit) return hit; }
  if (row.clientId && S.cli[row.clientId]) return [row.clientId, S.cli[row.clientId]];
  const nombre = String(row.nombre||"").trim().toLowerCase();
  if (nombre && !cuenta) return list.find(([,c]) => String(c.nombre||"").trim().toLowerCase()===nombre) || null;
  return null;
}

async function guardarImport(kind, rows){

      const data = ordenDoc(Object.assign({by:S.email}, base, {nombre:r.nombre||base.nombre||"Cliente"}));

    });
    return chunked(ops);
  }

    const ops = [];

    rows.forEach(r => {
      const hit = findCli(r); if (!hit) { faltan++; return; }

  });
  return chunked(ops);
}

      ${autos.length?`<div class="tbl" style="margin-top:10px"><table><tr><th>Cliente</th><th>Cuándo</th><th class="n">Monto</th><th>Método</th><th></th></tr>${autos.map(([id,a]) => `<tr><td>${a.clientId&&S.cli[a.clientId]?`<button type="button" class="linkish" data-open="${esc(a.clientId)}">${esc(S.cli[a.clientId].nombre||a.nombre)}</button>`:esc(a.nombre||"—")}</td><td>${a.fecha?esc(a.fecha):a.dia?`Día ${a.dia}`:"—"}</td><td class="n">${money(a.monto)}</td><td>${esc(METODO_AUTO[a.metodo]||a.metodo)}</td><td><button class="btn small ghost" data-auto="${esc(id)}">Editar</button></td></tr>`).join("")}</table></div>`:`<div class="empty">Todavía no hay pagos automáticos.</div>`}</div>`;
}
function openAuto(id){ const a = id ? (S.autos[id]||{}) : {};
  openModal(`<h3>${id?"Editar pago automático":"Pago automático"}</h3><div class="grid2">
    <label class="f">Cuenta<select class="i" id="au-cli">${optsCli(a.clientId||"")}</select></label>
    <label class="f">Nombre si no está en la lista<input class="i" id="au-n" value="${esc(a.nombre||"")}"></label>
    <label class="f">Número de cuenta<input class="i" id="au-c" value="${esc(a.cuenta||"")}"></label>
    <label class="f">Día del mes (1-31)<input class="i" id="au-d" type="number" min="0" max="31" value="${a.dia||""}"></label>
    <label class="f">O una fecha fija<input class="i" id="au-f" type="date" value="${esc(a.fecha||"")}"></label>
    <label class="f">Monto<input class="i" id="au-m" type="number" min="0" step="0.01" value="${a.monto??""}"></label>
    <label class="f">Método<select class="i" id="au-met">${Object.entries(METODO_AUTO).map(([k,l]) => `<option value="${k}" ${(a.metodo||"tarjeta")===k?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="f" style="grid-column:1/-1">Notas<input class="i" id="au-no" value="${esc(a.notas||"")}"></label>
  </div><div class="row"><button class="btn" id="au-ok">Guardar</button><button class="btn ghost" data-close>Cerrar</button></div>`, () => {
    $("#au-ok").onclick = async () => { const cid = qv("au-cli"); const c = S.cli[cid]; const nombre = qv("au-n").trim() || (c&&c.nombre) || ""; if (!nombre && !qv("au-c")) return toast("Escribe el cliente o el número de cuenta");
      const data = autoFila({clientId:cid, nombre, cuenta:qv("au-c").trim()||(c&&c.cuenta)||"", dia:qv("au-d"), fecha:qv("au-f"), monto:qv("au-m"), metodo:qv("au-met"), notas:qv("au-no")}, a.by||S.email);
      try { if (id) await S.db.doc("cautopago/"+id).set(data); else await S.db.collection("cautopago").add(data); closeModal(); toast("Pago automático guardado"); } catch(e){ err(e); } };
  });
}
function openAgenda(id){ const a = id ? (S.agenda[id]||{}) : {asignada:S.email, hora:"09:00", fecha:today(), tipo:"llamar"};
  openModal(`<h3>${id?"Editar cita":"Nueva cita"}</h3><div class="grid2">
    <label class="f">Fecha<input class="i" type="date" id="ag-f" value="${esc(a.fecha||today())}"></label>
    <label class="f">Hora<input class="i" type="time" id="ag-h" value="${esc((a.hora||"09:00").slice(0,5))}"></label>
    <label class="f">Cuenta<select class="i" id="ag-cli">${optsCli(a.clientId||"")}</select></label>
    <label class="f">Nombre si no está en la lista<input class="i" id="ag-n" value="${esc(a.nombre||"")}"></label>
    <label class="f">Tipo<select class="i" id="ag-t">${Object.entries(AGENDA_TIPO).map(([k,l]) => `<option value="${k}" ${(a.tipo||"llamar")===k?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="f">Asignada a<select class="i" id="ag-as">${optsGente(a.asignada||S.email, true)}</select></label>
    <label class="f" style="grid-column:1/-1">Notas<textarea class="i" id="ag-no">${esc(a.notas||"")}</textarea></label>
  </div><div class="row"><button class="btn" id="ag-ok">Guardar</button><button class="btn ghost" data-close>Cerrar</button></div>`, () => {
    $("#ag-ok").onclick = async () => { const cid = qv("ag-cli"); const c = S.cli[cid]; const nombre = qv("ag-n").trim() || (c&&c.nombre) || ""; if (!nombre) return toast("Escribe el cliente");
      const data = agendaFila(Object.assign({}, a, {fecha:qv("ag-f")||today(), hora:qv("ag-h")||"09:00", clientId:cid, nombre, tipo:qv("ag-t"), asignada:qv("ag-as")||S.email, notas:qv("ag-no"), estado:a.estado||"pendiente", hechoAt:a.hechoAt||0, createdAt:a.createdAt||Date.now()}), a.by||S.email);
      try { if (id) await S.db.doc("cagenda/"+id).set(data); else await S.db.collection("cagenda").add(data); closeModal(); toast("Cita guardada"); } catch(e){ err(e); } };
  });
}
function metAuto(v){ const n = String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); if (n.includes("cheq")) return "cheque"; if (n.includes("sitio")||n.includes("web")) return "sitio"; if (n.includes("llama")) return "llamada"; return "tarjeta"; }
function normKeyAg(s){ return String(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""); }
async function importarAutos(file){
  await new Promise((ok, no) => { if (window.XLSX) return ok(); const s = document.createElement("script"); s.src = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"; s.onload = ok; s.onerror = () => no(new Error("xlsx")); document.head.appendChild(s); });
  const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:"", raw:false});
  const ops = [];
  rows.forEach(o => { const map = {}; Object.entries(o).forEach(([k,v]) => map[normKeyAg(k)] = v);
    const nombre = String(map.nombre||map.cliente||map.name||"").trim(); const cuenta = String(map.cuenta||map.account||"").trim();
    const fecha = L.asDate(map.fecha||map.date||""); const dia = parseInt(String(map.dia||map.day||"").replace(/\D/g,""), 10) || 0;
    const monto = parseFloat(String(map.monto||map.amount||map.pago||"").replace(/[$,\s]/g,"")) || 0;
    if (!nombre && !cuenta) return; const hit = findCli({nombre, cuenta, tel:""});
    ops.push(autoFila({clientId:hit?hit[0]:"", nombre:nombre||(hit&&hit[1].nombre)||"", cuenta, dia:fecha?0:dia, fecha, monto, metodo:metAuto(map.metodo||map.method||""), notas:String(map.notas||map.notes||"")}, S.email));
  });
  if (!ops.length) return toast("No reconocí filas. Usa columnas nombre, cuenta, dia o fecha, monto, metodo.");
  await chunked(ops.map(d => b => b.set(S.db.collection("cautopago").doc(), d)));
  toast("Listo: "+ops.length+" pago(s) automático(s)");
}
async function marcarHecho(id){ const a = S.agenda[id]; if (!a) return;
  try { await S.db.doc("cagenda/"+id).set(agendaFila(Object.assign({}, a, {estado:"hecho", hechoAt:Date.now()}), a.by||S.email)); if (a.clientId) await logAct(a.clientId, {tipo:"nota", resultado:"", mensaje:"Agenda hecha: "+(AGENDA_TIPO[a.tipo]||a.tipo)}); toast("Marcada como hecha"); }
  catch(e){ err(e); }
}
async function resolverRev(autopagoId, fecha, resultado){ const a = S.autos[autopagoId]; if (!a) return;
  const rev = {autopagoId, fecha, resultado, by:S.email, at:Date.now()};
  try {
    await S.db.doc("carev/"+autopagoId+"_"+fecha).set(rev);
    if (resultado==="rechazado"){ const c = S.cli[a.clientId]; const nombre = (c&&c.nombre)||a.nombre||"Cliente";
      await S.db.collection("cagenda").add(agendaFila({fecha:today(), hora:"09:00", clientId:a.clientId||"", nombre, tipo:"llamar", asignada:c?encargada(c)||S.email:S.email, notas:"Pago automático rechazado. Llamar hoy.", estado:"pendiente", hechoAt:0}, S.email));
      if (a.clientId) await logAct(a.clientId, {tipo:"nota", resultado:"", mensaje:"Revisión del pago automático: rechazado"});
      toast("Rechazado. Quedó una llamada para hoy.");
    } else { if (a.clientId) await logAct(a.clientId, {tipo:"nota", resultado:"pago", mensaje:"Revisión del pago automático: procesado"}); toast("Marcado como procesado"); }
  } catch(e){ err(e); }
}
function bind(){
  const all = (q,f) => document.querySelectorAll(q).forEach(f);
  all("[data-c]", b => b.onclick = ev => { if (ev.target.closest("button, .linkish")) return; openCli(b.dataset.c); });
  all("[data-phone]", b => b.onclick = ev => { ev.stopPropagation(); openMenu(b.dataset.phone); });
  all("[data-open]", b => b.onclick = ev => { ev.stopPropagation(); openCli(b.dataset.open); });
  all("[data-agw]", b => b.onclick = () => { S.agWhen = b.dataset.agw; render(); });
  const aw = $("#ag-who"); if (aw) aw.onchange = () => { S.agWho = aw.value; render(); };
  document.querySelectorAll("[data-agv]").forEach(b => b.onclick = () => { S.agVista = b.dataset.agv; render(); });
  const aa = $("#ag-add"); if (aa) aa.onclick = () => openAgenda(null);
  const an = $("#ag-new"); if (an) an.onclick = () => openAuto(null);
  all("[data-auto]", b => b.onclick = () => openAuto(b.dataset.auto));
  all("[data-hecho]", b => b.onclick = ev => { ev.stopPropagation(); marcarHecho(b.dataset.hecho); });
  all("[data-rev]", b => b.onclick = ev => { ev.stopPropagation(); const [id,fecha,res] = b.dataset.rev.split("|"); resolverRev(id, fecha, res); });
  const dk = $("#ag-drive-ok"); if (dk) dk.onclick = async () => { const url = qv("ag-drive").trim(); if (url && !/^https:\/\//i.test(url)) return toast("El enlace tiene que empezar con https://"); try { await S.db.doc("cautolink/main").set({url, by:S.email, updatedAt:Date.now()}); toast("Enlace guardado"); } catch(e){ err(e); } };
  const fl = $("#ag-file"); if (fl) fl.onchange = async () => { const f = fl.files && fl.files[0]; fl.value = ""; if (!f) return; try { await importarAutos(f); } catch(e){ toast("No se pudo leer el archivo. Prueba con CSV o Excel."); console.log(e); } };
  all("[data-ord]", b => b.onclick = () => openOrden(b.dataset.ord));
  const q = $("#q"); if (q) q.oninput = () => { S.f.q = q.value; clearTimeout(S.qt); S.qt = setTimeout(() => { const pos = q.selectionStart; render(); const e = $("#q"); if (e){ e.focus(); try { e.setSelectionRange(pos,pos); } catch(err){} } }, 280); };
  const fc = $("#f-cob"); if (fc) fc.onchange = () => { S.f.cob = fc.value; render(); };
  const ft = $("#f-tono"); if (ft) ft.onchange = () => { S.f.tono = ft.value; render(); };
  const mi = $("#mios"); if (mi) mi.onchange = () => { S.f.mios = mi.checked; render(); };
  const ac = $("#add-c"); if (ac) ac.onclick = () => openNuevo();
  const im = $("#imp"); if (im) im.onclick = () => openImport("clientes");
  const ip = $("#imp-portal"); if (ip) ip.onclick = openPortal;
  const ao = $("#add-ord"); if (ao) ao.onclick = () => openOrden(null);
  const io = $("#imp-ord"); if (io) io.onclick = () => openImport("ordenes");
  const ia = $("#imp-act"); if (ia) ia.onclick = () => openImport("actividad");
  all("[data-per]", b => b.onclick = () => { S.per = b.dataset.per; render(); });
  all("[data-lista]", b => b.onclick = () => llenarLink(b.dataset.lista));
  all("[data-rv]", b => b.onclick = async ev => { ev.stopPropagation(); const [id,r] = b.dataset.rv.split("|"); const up = {["revis."+ym()]:r}; up["log"] = firebase.firestore.FieldValue.arrayUnion({at:Date.now(), by:S.email, res:"nota", nota:r==="paso"?"Pago automático: pasó":"Pago automático: NO pasó"}); if (r==="no") up.prox = Date.now(); try { await S.db.doc("ccli/"+id).update(up); toast(r==="paso"?"Anotado: pasó":"Anotado"); } catch(e){ err(e); } });
  all("[data-pv]", b => b.onclick = () => { const id = b.dataset.pv, a = S.ventas[id]||{}, p = priv(id)||{}; openNuevo({nombre:nombreVenta(id,a,p), tel:p.phone||"", ciudad:p.city||a.zona||"", direccion:p.address||"", monto:a.amount||0, apptId:id, fechaVenta:a.when?laDate(a.when):"", vendedorId:a.socioId||"", vendedorNombre:memberNom(a.socioId)}); });
  const sf = $("#st-f"); if (sf) sf.onsubmit = async e => { e.preventDefault(); const em = qv("st-e").trim().toLowerCase(); if (!em) return; try { await S.db.doc("cconfig/main").set({staff:{[em]:{name:qv("st-n").trim().slice(0,60), roles:[]}}}, {merge:true}); toast("Agregada. Ahora marca qué le toca."); } catch(x){ err(x); } };
  all("[data-rol]", i => i.onchange = async () => { const [em,k] = i.dataset.rol.split("|"); const roles = new Set(staff()[em]?.roles||[]); i.checked ? roles.add(k) : roles.delete(k); try { await S.db.doc("cconfig/main").set({staff:{[em]:Object.assign({}, staff()[em], {roles:[...roles]})}}, {merge:true}); } catch(x){ err(x); } });
  all("[data-stdel]", b => b.onclick = async () => { if (!confirm("¿Quitarle el acceso a "+b.dataset.stdel+"?")) return; try { await S.db.doc("cconfig/main").update(new firebase.firestore.FieldPath("staff", b.dataset.stdel), firebase.firestore.FieldValue.delete()); } catch(x){ err(x); } });
  const tq = $("#tar-q"); if (tq) tq.oninput = () => { const s = tq.value.trim().toLowerCase(); document.querySelectorAll("[data-tarrow]").forEach(el => { el.hidden = !!(s && !el.dataset.tarrow.includes(s)); }); };
  all("[data-tar]", i => i.onchange = () => toggleTarjeta(i.dataset.tar, i.checked));
  const ts = $("#tar-save"); if (ts) ts.onclick = () => guardarTarjetas(tarjetasElegidas());
}
function tarjetasElegidas(){ return [...document.querySelectorAll("[data-tar]:checked")].map(i => i.dataset.tar).filter(id => S.members[id]?.role!=="bot"); }
function toggleTarjeta(uid, on){
  if (S.members[uid]?.role==="bot") return toast("Los bots no pueden ver tarjetas.");
  if (!Array.isArray(S.cfg.tarjetas)){ S.tarDraft = tarjetasElegidas(); return; }
  const next = (S.cfg.tarjetas||[]).filter(x => x!==uid && S.members[x]?.role!=="bot");
  if (on) next.push(uid);
  guardarTarjetas(next);
}
async function guardarTarjetas(ids){
  const limpio = [...new Set(ids)].filter(id => !S.members[id] || S.members[id].role!=="bot");
  try { await S.db.doc("cconfig/main").set({tarjetas:limpio}, {merge:true}); S.tarDraft = null; S.cfg.tarjetas = limpio; toast("Lista de tarjetas guardada"); render(); }
  catch(e){ err(e); }
}
function loginHtml(){ return `<div class="card" style="max-width:440px;margin:0 auto;width:100%"><h2>Entrar</h2><button class="btn dark" id="lg-g" style="width:100%">Entrar con Google</button>
  <p class="note" style="text-align:center">o con tu correo</p><form id="lg-f" style="display:grid;gap:10px"><input class="i" id="lg-e" type="email" placeholder="Correo" required><input class="i" id="lg-p" type="password" placeholder="Contraseña" minlength="6" required>
  <div class="row"><button class="btn" data-m="in">Entrar</button><button class="btn ghost" data-m="up">Crear cuenta</button></div></form><div id="lg-msg" class="note"></div></div>`; }
function bindLogin(){ $("#lg-g").onclick = () => { const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"}); S.auth.signInWithPopup(p).catch(() => $("#lg-msg").textContent = "No se pudo entrar con Google. Prueba con tu correo."); };
  let mode = "in"; document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => mode = b.dataset.m);
  $("#lg-f").onsubmit = e => { e.preventDefault(); const em = $("#lg-e").value.trim(), pw = $("#lg-p").value; (mode==="up" ? S.auth.createUserWithEmailAndPassword(em, pw) : S.auth.signInWithEmailAndPassword(em, pw)).catch(() => $("#lg-msg").textContent = "Correo o contraseña incorrectos."); }; }
/* ===== Perfil con foto (el mismo de Lunaya: members/{uid}.photo) ===== */
const PF = {me:null, byMail:{}};
function pfCargar(){ if (!S.user) return; try { S.unsub.push(S.db.doc("members/"+S.user.uid).onSnapshot(d => { PF.me = d.exists ? d.data() : null; pfHeader(); }, () => {})); } catch {}
  S.db.collection("members").get().then(q => { q.docs.forEach(d => { const m = d.data(); if (m.email) PF.byMail[String(m.email).toLowerCase()] = m; }); try { render(); } catch {} }).catch(() => {}); }
const pfAv = (em, size) => { size = size || 30; const m = em===S.email ? PF.me : PF.byMail[String(em||"").toLowerCase()]; const nm = (m && m.name) || (typeof nameOf==="function" ? nameOf(em) : "") || em || "?"; const ini = String(nm).trim().split(/\s+/).slice(0,2).map(w => w[0]||"").join("").toUpperCase();
  return m && /^data:image\//.test(m.photo||"") ? `<img src="${m.photo}" alt="" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;vertical-align:middle;flex:none">` : `<span style="display:inline-grid;place-items:center;width:${size}px;height:${size}px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:${Math.round(size*.38)}px;vertical-align:middle;flex:none">${esc(ini)}</span>`; };
function pfHeader(){ const brand = document.querySelector(".brand"); if (!brand) return; let b = document.getElementById("pf-btn"); if (!S.user){ if (b) b.remove(); return; }
  if (!b){ b = document.createElement("button"); b.id = "pf-btn"; b.type = "button"; b.style.cssText = "margin-left:auto;background:none;border:0;cursor:pointer;display:grid;justify-items:center;gap:2px;font:inherit;font-size:11px;font-weight:700;color:var(--muted)"; b.onclick = pfAbrir; brand.appendChild(b); }
  b.innerHTML = pfAv(S.email, 46) + (PF.me && PF.me.photo ? "Mi perfil" : "📷 Poner foto"); }
function pfAbrir(){ if (!PF.me){ toast("Tu perfil se arma en Lunaya"); return; }
  openModal(`<h3>Mi perfil</h3><div style="text-align:center">${pfAv(S.email, 120)}<div style="margin-top:8px;font-weight:800;font-size:18px">${esc(PF.me.name||"")}</div><div class="note">${esc(S.email)}</div></div>
    <div class="row" style="justify-content:center"><label class="btn small" style="cursor:pointer">📷 ${PF.me.photo?"Cambiar foto":"Poner foto"}<input type="file" id="pf-f" accept="image/*" hidden></label>${PF.me.photo?`<button class="btn small ghost" id="pf-x">Quitar foto</button>`:""}<button class="btn small ghost" data-close>Cerrar</button></div>
    <p class="note" style="text-align:center">Es la misma foto de Lunaya: si la cambias aquí, cambia en todas partes.</p>`, () => {
    document.getElementById("pf-f").onchange = e => { const f = e.target.files[0]; if (!f) return; const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = 240; const s0 = Math.min(img.width, img.height); c.getContext("2d").drawImage(img, (img.width-s0)/2, (img.height-s0)/2, s0, s0, 0, 0, 240, 240);
      S.db.doc("members/"+S.user.uid).update({photo:c.toDataURL("image/jpeg", .85)}).then(() => { toast("Foto guardada"); closeModal(); }, e2 => { console.log(e2); toast("No se pudo guardar la foto"); }); }; img.onerror = () => toast("No se pudo abrir esa foto"); img.src = URL.createObjectURL(f); };
    const x = document.getElementById("pf-x"); if (x) x.onclick = () => S.db.doc("members/"+S.user.uid).update({photo:""}).then(() => { toast("Foto quitada"); closeModal(); }, () => toast("No se pudo")); }); }
boot();
</script>
