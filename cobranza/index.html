<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8dcc6">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8dcc6;--card:#fffdf8;--ink:#1f1e1d;--muted:#6f6a5e;--line:#dfd3bc;--soft:#f4ecdd;--accent:#2f6f73;--accent-soft:#dcecea;--good:#3f7d4e;--good-bg:#e5efe2;--warn:#a3651a;--warn-bg:#f8ecd6;--bad:#b4442f;--bad-bg:#f7e1db;--blue:#1d5f99;--blue-bg:#e3eef6;--serif:"Source Serif 4",Georgia,serif;--body:"Manrope",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{padding:18px 16px 0;max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;border-bottom:1.5px solid var(--line);padding-bottom:12px;margin-bottom:10px}
.brand b{font-family:var(--serif);font-size:30px;letter-spacing:.06em}.brand small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-size:23px;margin:6px 0 2px;text-transform:uppercase}.sub{color:var(--muted);margin:0 0 4px;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;position:sticky;top:0;z-index:6;background:var(--bg);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-weight:800;font-size:13.5px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button small{font-weight:700;opacity:.75}
html.framed header{padding-top:8px}html.framed .brand{display:none}
main{max-width:980px;margin:0 auto;padding:4px 16px 28px;display:grid;gap:14px}main>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-family:var(--serif);font-size:18px;text-transform:uppercase;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.dark{background:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.small{padding:7px 12px;font-size:13.5px}.btn.danger{background:var(--bad)}.btn.wa{background:#25d366;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.i{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px}
textarea.i{min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.item .t{font-weight:800;font-size:16px}.item .m{color:var(--muted);font-size:13px}
.item.normal{border-left-color:var(--accent)}.item.verde{border-left-color:var(--good)}.item.amarillo{border-left-color:#d4a017}.item.naranja{border-left-color:#e07a1f}.item.rojo{border-left-color:var(--bad)}.item.azul{border-left-color:var(--blue)}
.item.hoy{box-shadow:inset 0 0 0 2px var(--bad)}.item.semana{box-shadow:inset 0 0 0 2px var(--warn)}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tg-good{background:var(--good-bg);color:var(--good)}.tg-warn{background:var(--warn-bg);color:var(--warn)}.tg-bad{background:var(--bad-bg);color:var(--bad)}.tg-mute{background:var(--soft);color:var(--muted)}.tg-acc{background:var(--accent-soft);color:var(--accent)}
.tg-blue{background:var(--blue-bg);color:var(--blue)}.tg-orange{background:#fde6d2;color:#b85a10}.tg-yellow{background:#f8efc4;color:#7a5b10}
.note{font-size:13px;color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:16px}
.banner{border-radius:12px;padding:12px 14px;font-weight:600}.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.bad{background:var(--bad-bg);color:var(--bad)}.banner.good{background:var(--good-bg);color:var(--good)}.banner.blue{background:var(--blue-bg);color:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.tile{background:var(--soft);border-radius:12px;padding:12px}.tile b{display:block;font-family:var(--serif);font-size:26px;line-height:1.05}.tile span{font-size:12px;color:var(--muted);font-weight:700}.tile small{display:block;font-size:12px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}th{font-size:11.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}td.n,th.n{text-align:right}
.tbl{overflow-x:auto}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:800;text-decoration:underline;cursor:pointer;text-align:left}
.nb{display:inline-block;background:#c0392b;color:#fff;border-radius:9px;font-size:10px;padding:0 5px;margin-left:2px}
.mbg{position:fixed;inset:0;background:rgba(31,30,29,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--card);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px}
@media (min-width:700px){.mbg{align-items:center}.modal{border-radius:20px}}
.modal h3{font-family:var(--serif);font-size:21px;margin:0;text-transform:uppercase}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.tl{display:grid;gap:6px;max-height:240px;overflow:auto}.tl div{background:var(--soft);border-radius:10px;padding:7px 10px;font-size:14px}.tl small{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:90%}
.secret{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.03em}
.scroll{max-height:280px;overflow:auto;display:grid;gap:6px}
</style>
</head>
<body>
<header>
<div class="brand"><svg viewBox="0 0 24 24" width="34" height="34" style="color:var(--accent)"><path fill="currentColor" d="M3 6h18v12H3zm2 2v2h14V8zm0 5v3h6v-3z"/></svg><div><b>LUNAYA</b><small>Cobranza y postventa</small></div></div>
<h1 id="title">Cargando…</h1><p class="sub" id="subtitle"></p>
<div id="tabs" class="tabs" hidden></div>
</header>
<main id="main"><div class="card empty">Cargando…</div></main>
<div id="modal"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../config.js"></script>
<script src="logic.js"></script>
<script>
if (window.top !== window.self) document.documentElement.classList.add("framed");
/* Cobranza v2. Cuentas en ccli (lo que ya había). Actividad en ccli/{id}/act.
   Órdenes de postventa en cpost. Pedidos de link en clinkreq. Pagos anotados en cpagos.
   Tarjetas en ctarjetas: solo Katerine y quien ella marque en cconfig/main.tarjetas.
   El bot crea y actualiza; no borra y no ve tarjetas. No se guarda el CVV. */
const L = window.Cobranza;
const TZ = "America/Los_Angeles";
const GRUPOS = {aldia:"Al día", g30:"0–30", g60:"31–60", g90:"61+"};
const ROLES = {g30:"Cobra 0–30", g60:"Cobra 31–60", g90:"Recompra (61+)", post:"Postventa", direccion:"Dirección"};
const TOP = [["g30","0-30"],["g60","31-60"],["g90","61+"],["post","Postventa"],["pagos","Pagos/Actividad"]];
const TIPOS = {llamada:"Llamada", whatsapp:"WhatsApp", sms:"SMS", correo:"Correo", nota:"Nota"};
const OUTS = {contesto:"Contestó", no:"No contestó", buzon:"Buzón", promesa:"Promesa de pago", pago:"Pagó", equivocado:"Número equivocado"};
const RES_OLD = {nc:"No contestó", promesa:"Promesa de pago", pago:"Pagó", otro_dia:"Que llame otro día", solo_kat:"Solo habla con Katerine", mal:"Número equivocado", nota:"Nota"};
const METODOS = {cheque:"Cheque", sitio:"Sitio web", llamada:"Llamada", tarjeta:"Tarjeta en archivo", link:"Link de Hy Cite", otro:"Otro"};
const METODO_AUTO = {cheque:"Cheque", sitio:"Sitio web", llamada:"Llamada", tarjeta:"Tarjeta en archivo"};
const SKIP_TXT = "En skip: Hy Cite tiene bloqueados pagos y links. Objetivo: que el cliente llame a Hy Cite para quitar el skip.";
const S = {db:null, auth:null, user:null, uid:"", email:"", owners:[], cfg:{}, me:null, meLoaded:false, cfgLoaded:false, cli:{}, acts:{}, actsReady:false, pagos:{}, post:{}, links:{}, cards:{}, members:{}, membersLoaded:false, ventas:{}, privs:{}, view:"g30", f:{q:"", cob:"", tono:"", mios:false}, per:"hoy", loaded:false, unsub:[], tarDraft:null, reveal:{}};

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tel10 = t => { const d = String(t||"").replace(/\D/g,""); return d.length===11 && d[0]==="1" ? d.slice(1) : (d.length>=10 ? d.slice(-10) : d); };
const telFmt = t => { const d = tel10(t); return d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (t||""); };
function partsLA(ms){ const o = {}; new Intl.DateTimeFormat("en-US",{timeZone:TZ,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date(ms)).forEach(p => o[p.type] = p.value); return o; }
function tzOff(ms){ const p = partsLA(ms); return Date.UTC(+p.year, +p.month-1, +p.day, +p.hour%24, +p.minute, +p.second) - Math.floor(ms/1000)*1000; }
function laToMs(d, t){ const [y,m,da] = String(d||"").split("-").map(Number); if (!y) return 0; const [h,mi] = (t||"00:00").split(":").map(Number); const g = Date.UTC(y,m-1,da,h||0,mi||0); return g - tzOff(g - tzOff(g)); }
const laDate = ms => { const p = partsLA(ms); return `${p.year}-${p.month}-${p.day}`; };
const today = () => laDate(Date.now());
function addDays(d, n){ const [y,m,da] = d.split("-").map(Number); return new Date(Date.UTC(y,m-1,da+n,12)).toISOString().slice(0,10); }
const fmt = (ms, o) => ms ? new Intl.DateTimeFormat("es-US",{timeZone:TZ,...o}).format(new Date(ms)) : "";
const fmtWhen = ms => fmt(ms,{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
function mondayOf(d){ const [y,m,da] = d.split("-").map(Number); const dow = (new Date(Date.UTC(y,m-1,da,12)).getUTCDay()+6)%7; return addDays(d,-dow); }
function rango(p){ const t = today(); if (p==="hoy") return [laToMs(t,"00:00"), laToMs(addDays(t,1),"00:00")];
  if (p==="semana"){ const mo = mondayOf(t); return [laToMs(mo,"00:00"), laToMs(addDays(mo,7),"00:00")]; }
  const f = t.slice(0,8)+"01"; const [y,m] = f.split("-").map(Number); const nx = new Date(Date.UTC(y,m,1,12)).toISOString().slice(0,10); return [laToMs(f,"00:00"), laToMs(nx,"00:00")]; }
const inR = (ms, r) => ms >= r[0] && ms < r[1];
function toast(m){ document.querySelectorAll(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function err(e){ console.log(e); toast(e && e.code==="permission-denied" ? "Sin permiso. Si acabas de actualizar, Katerine todavía tiene que pegar las reglas nuevas en Firebase." : "No se pudo guardar. Revisa tu conexión."); }
function openModal(html, bind){ $("#modal").innerHTML = `<div class="mbg" id="mbg"><div class="modal">${html}</div></div>`; $("#mbg").onclick = e => { if (e.target.id==="mbg") closeModal(); }; $("#modal").querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal); bind && bind(); }
function closeModal(){ $("#modal").innerHTML = ""; S.open = null; }
const qv = id => { const n = document.getElementById(id); return n ? n.value : ""; };

const staff = () => S.cfg.staff || {};
const isOwner = () => S.owners.includes(S.email);
const isBot = () => S.me?.role === "bot" && !S.me?.bloqueado;
const isDir = () => isOwner() || isBot() || (staff()[S.email]?.roles||[]).includes("direccion");
const canEnter = () => isOwner() || isBot() || !!staff()[S.email];
const veTarjetas = () => !isBot() && (isOwner() || (S.cfg.tarjetas||[]).includes(S.uid));
const nameOf = em => em ? (staff()[em]?.name || (S.owners.includes(em) ? "Katerine" : String(em).split("@")[0])) : "—";
const first = n => String(n||"").trim().split(/\s+/)[0];
const money = n => "$" + (+n||0).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
const conRol = r => Object.entries(staff()).filter(([,v]) => (v.roles||[]).includes(r)).map(([em]) => em);
const bucketOf = c => L.bucketOf(c.atraso);
const vencidoDe = c => (c.vencido != null && c.vencido !== "") ? (+c.vencido||0) : (+c.saldo||0);
const mensualDe = c => (c.mensual != null && c.mensual !== "") ? (+c.mensual||0) : (+(c.pago&&c.pago.monto)||0);
const encargada = c => c.asignada || (conRol(bucketOf(c))[0] || "");
const finDia = () => laToMs(addDays(today(),1), "00:00");
const ym = () => today().slice(0,7);
const diaHoy = () => +today().slice(8,10);
const ultimoDia = () => { const [y,m] = today().split("-").map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
const pagaHoy = c => c.pago?.dia && c.etapa!=="cerrado" && (Math.min(+c.pago.dia, ultimoDia()) === diaHoy()) && !(c.revis||{})[ym()];
const esMio = c => isDir() ? true : (encargada(c)===S.email || (c.etapa==="postventa" && (staff()[S.email]?.roles||[]).includes("post")));
const postFalta = c => [!c.post?.llamada && "Llamada de bienvenida", !c.post?.visita?.hecha && "Visita de entrega", !c.pago?.dia && "Pagos automáticos"].filter(Boolean);
function streakNo(id, c){
  const items = [];
  (S.acts[id]||[]).forEach(a => items.push({at:a.at||0, no:a.resultado==="no"||a.resultado==="buzon", hit:["contesto","promesa","pago","equivocado"].includes(a.resultado)}));
  (c.log||[]).forEach(x => items.push({at:x.at||0, no:x.res==="nc", hit:["promesa","pago","mal","contesto"].includes(x.res)}));
  if (!items.length) return +c.sinContestar||0;
  items.sort((a,b)=>a.at-b.at); let n = 0;
  items.forEach(x => { if (x.hit) n = 0; else if (x.no) n++; });
  return n;
}
const tono = (id,c) => L.toneOf({...c, sinContestar:streakNo(id,c)});
function llamadasDe(id,c){ const legacy = (c.log||[]).filter(x => x.res && x.res!=="nota").length; if (S.actsReady) return (S.acts[id]||[]).filter(a => a.tipo==="llamada").length + legacy; return (+c.llamadas||0) + legacy; }
function ultimoDe(id,c){ const t = [c.ultContacto||0, c.ultLlamada||0]; (S.acts[id]||[]).forEach(a => t.push(a.at||0)); (c.log||[]).forEach(x => t.push(x.at||0)); return Math.max(0,...t); }
function touch(o){ o.updatedAt = Date.now(); if (isBot()){ o.lastSyncAt = Date.now(); o.syncedBy = S.email; } return o; }
function semanaDe(fecha){ if (!fecha) return ""; const t = today(); if (fecha===t) return "hoy"; if (fecha<t) return "pasada"; const mo = mondayOf(t); if (fecha>=mo && fecha<=addDays(mo,6)) return "semana"; return "luego"; }

function boot(){
  const cfg = window.LUNAYA_CONFIG || {}; if (!window.firebase || !cfg.firebase){ $("#main").innerHTML = `<div class="card"><h2>Falta configurar</h2></div>`; return; }
  firebase.initializeApp(cfg.firebase); S.auth = firebase.auth(); S.db = firebase.firestore(); S.owners = (cfg.owners||[]).map(x => String(x).toLowerCase());
  S.auth.onAuthStateChanged(u => {
    S.unsub.forEach(f => { try { f(); } catch(e){} }); S.unsub = [];
    S.user = u; S.uid = u?.uid||""; S.email = (u?.email||"").toLowerCase();
    S.me = null; S.meLoaded = !u; S.cfg = {}; S.cfgLoaded = !u; S.loaded = false; S.cli = {}; S.subC = false; S.subCards = false; S.subM = false; S.membersLoaded = false;
    if (!u) return render();
    S.unsub.push(S.db.doc("members/"+S.uid).onSnapshot(s => { S.me = s.exists ? s.data() : null; S.meLoaded = true; maybeSub(); render(); }, () => { S.meLoaded = true; render(); }));
    S.unsub.push(S.db.doc("cconfig/main").onSnapshot(s => { S.cfg = s.exists ? s.data() : {}; S.cfgLoaded = true; if (!S.fInit && canEnter() && !isDir()) S.f.mios = true; S.fInit = S.fInit || canEnter(); maybeSub(); render(); }, () => { S.cfgLoaded = true; render(); }));
  });
}
function maybeSub(){ if (!S.meLoaded || !S.cfgLoaded || !canEnter()) return; if (!S.subC) subCli(); if (isOwner() && !S.subM) subMembers(); ensureCards(); }
function subMembers(){ S.subM = true; S.unsub.push(S.db.collection("members").onSnapshot(s => { S.members = {}; s.docs.forEach(d => S.members[d.id] = d.data()); S.membersLoaded = true; render(); }, e => { console.log(e); S.membersLoaded = true; render(); })); }
function ensureCards(){ if (S.subCards || !veTarjetas()) return; S.subCards = true;
  S.unsub.push(S.db.collection("ctarjetas").onSnapshot(s => { S.cards = {}; s.docs.forEach(d => S.cards[d.id] = d.data()); render(); }, e => { console.log("tarjetas", e); S.cards = {}; S.extraErr = Object.assign(S.extraErr||{}, {tarjetas:true}); render(); })); }
function subCli(){ S.subC = true;
  const bad = name => e => { console.log(name, e); S.extraErr = Object.assign(S.extraErr||{}, {[name]:true}); render(); };
  S.unsub.push(S.db.collection("ccli").onSnapshot(s => { S.cli = {}; s.docs.forEach(d => S.cli[d.id] = d.data()); S.loaded = true; S.loadErr = false; render(); }, e => { console.log(e); S.loaded = true; S.loadErr = true; render(); }));
  S.unsub.push(S.db.collectionGroup("act").onSnapshot(s => { S.acts = {}; s.docs.forEach(d => { const cid = d.ref.parent.parent.id; (S.acts[cid] = S.acts[cid]||[]).push(Object.assign({id:d.id}, d.data())); }); S.actsReady = true; render(); }, bad("act")));
  S.unsub.push(S.db.collection("cpagos").onSnapshot(s => { S.pagos = {}; s.docs.forEach(d => S.pagos[d.id] = Object.assign({id:d.id}, d.data())); render(); }, bad("pagos")));
  S.unsub.push(S.db.collection("cpost").onSnapshot(s => { S.post = {}; s.docs.forEach(d => S.post[d.id] = Object.assign({id:d.id}, d.data())); render(); }, bad("post")));
  S.unsub.push(S.db.collection("clinkreq").onSnapshot(s => { S.links = {}; s.docs.forEach(d => S.links[d.id] = Object.assign({id:d.id}, d.data())); render(); }, bad("links")));
  if (isOwner()){ const uid = S.user.uid;
    S.unsub.push(S.db.collection("appts").where("saleStatus","==","aprobada").onSnapshot(s => { S.ventas = {}; s.docs.forEach(d => S.ventas[d.id] = d.data()); render(); }, e => console.log("ventas", e)));
    [["socioId",uid],["up",uid],["dueno",uid],["dador",uid],["teleId",uid]].forEach(([f,v]) => S.unsub.push(S.db.collection("apptp").where(f,"==",v).onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); S.privs[f] = m; render(); }, e => console.log("apptp", f, e)))); }
}
const priv = id => { for (const k in S.privs){ if (S.privs[k][id]) return S.privs[k][id]; } return null; };
const ventasNuevas = () => { const ya = new Set(Object.values(S.cli).map(c => c.apptId).filter(Boolean)); const desde = Date.now() - 120*864e5;
  return Object.entries(S.ventas).filter(([id,a]) => a.sale && !ya.has(id) && !a.cobOff && (a.saleStatusAt || a.when || 0) >= desde).sort((x,y) => (y[1].saleStatusAt||y[1].when||0) - (x[1].saleStatusAt||x[1].when||0)); };

function pasaQuery(c){ const q = (S.f.q||"").trim().toLowerCase(); if (!q) return true; const qd = q.replace(/\D/g,"");
  return String(c.nombre||"").toLowerCase().includes(q) || String(c.cuenta||"").toLowerCase().includes(q) || String(c.email||"").toLowerCase().includes(q) || String(c.producto||"").toLowerCase().includes(q) || (qd.length>=3 && tel10(c.tel).includes(qd)); }
function pasaFiltro(id,c){
  if (S.f.mios && !esMio(c)) return false;
  const who = encargada(c);
  if (S.f.cob==="sin" && who) return false;
  if (S.f.cob && S.f.cob!=="sin" && who!==S.f.cob && c.asignada!==S.f.cob) return false;
  const t = tono(id,c);
  if (S.f.tono==="skip" && t!=="rojo") return false;
  if (S.f.tono==="update" && !L.esUpdate(c)) return false;
  if (S.f.tono==="promesa" && t!=="amarillo") return false;
  if (S.f.tono==="no" && streakNo(id,c)<3) return false;
  if (S.f.tono==="verde" && t!=="verde") return false;
  return pasaQuery(c);
}
function enBucket(c,g){ return c.etapa!=="cerrado" && bucketOf(c)===g; }
const countB = g => Object.values(S.cli).filter(c => enBucket(c,g)).length;

function render(){
  const m = $("#main"), tabs = $("#tabs");
  if (!S.auth){ m.innerHTML = `<div class="card empty">Cargando…</div>`; return; }
  if (!S.user){ tabs.hidden = true; $("#title").textContent = "Entrar"; $("#subtitle").textContent = "Usa la misma cuenta de Lunaya."; m.innerHTML = loginHtml(); bindLogin(); return; }
  if (!S.cfgLoaded || !S.meLoaded){ m.innerHTML = `<div class="card empty">Cargando…</div>`; return; }
  if (S.me?.bloqueado && !isOwner()){ tabs.hidden = true; $("#title").textContent = "Acceso suspendido"; $("#subtitle").textContent = ""; m.innerHTML = `<div class="card"><h2>Acceso suspendido</h2><p>Pídele a Katerine que te lo devuelva.</p><button class="btn ghost small" id="out">Salir</button></div>`; $("#out").onclick = () => S.auth.signOut(); return; }
  if (!canEnter()){ tabs.hidden = true; $("#title").textContent = "Sin acceso"; $("#subtitle").textContent = "";
    m.innerHTML = `<div class="card"><h2>Todavía no tienes acceso</h2><p>Pídele a Katerine que te agregue al equipo de cobranza con este correo:</p><p><b>${esc(S.email)}</b></p><button class="btn ghost small" id="out">Salir</button></div>`; $("#out").onclick = () => S.auth.signOut(); return; }
  const tops = TOP.concat([["hoy","Hoy"]]); if (isOwner()) tops.push(["ajustes","Equipo"]);
  if (!tops.some(t => t[0]===S.view)) S.view = "g30";
  tabs.hidden = false;
  tabs.innerHTML = tops.map(([k,l]) => `<button data-go="${k}" class="${S.view===k?"on":""}">${l}${k==="g30"||k==="g60"||k==="g90"?` <small>${countB(k)}</small>`:""}</button>`).join("");
  tabs.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { S.view = b.dataset.go; render(); scrollTo(0,0); });
  const T = {g30:["0-30 días","De 1 a 30 días de atraso. Al día (0) se ve en verde, en la búsqueda."], g60:["31-60 días","Cuentas con 31 a 60 días de atraso."], g90:["61+","61 días o más. Recompra."], post:["Postventa","Entregas, rastreo y pago programado."], pagos:["Pagos y actividad","Llamadas del equipo, promesas y pagos anotados."], hoy:["Hola, "+first(nameOf(S.email)),"Pagos automáticos de hoy y ventas nuevas."], ajustes:["Equipo","Quién cobra y quién puede ver las tarjetas."]};
  const tit = T[S.view] || ["Cobranza",""]; $("#title").textContent = tit[0]; $("#subtitle").textContent = tit[1];
  if (!S.loaded){ m.innerHTML = `<div class="card empty">Cargando clientes…</div>`; return; }
  if (S.loadErr){ m.innerHTML = `<div class="card"><h2>Falta un paso</h2><p class="note">Pega las reglas nuevas de Firebase (Firestore → Reglas → Publicar) y vuelve a abrir esta página. No se publican solas.</p></div>`; return; }
  const extra = S.extraErr ? `<div class="banner warn">Parte de Cobranza nueva todavía no se puede leer. Katerine tiene que pegar las reglas nuevas en Firebase.</div>` : "";
  m.innerHTML = extra + ({g30:vBucket, g60:vBucket, g90:vBucket, post:vPost, pagos:vPagos, hoy:vHoy, ajustes:vAjustes})[S.view]();
  bind();
  if (S.open && S.cli[S.open] && !document.querySelector(".modal input:focus, .modal textarea:focus, .modal select:focus")) { /* la ficha se reabre al guardar, no en cada snapshot */ }
}

function textoDe(c){ return L.mensajeCliente({nombre:c.nombre, cuenta:c.cuenta, producto:c.producto||c.pedido, saldo:c.saldo, mensual:mensualDe(c), vencido:vencidoDe(c), atraso:c.atraso, pagosAtras:c.pagosAtras, proxVence:c.proxVence, updateOn:c.updateOn, updateMonto:c.updateMonto, updateAprobado:c.updateAprobado, payLink:c.payLink, skip:c.skip}, first(nameOf(S.email))||"Cobranza"); }

function vBucket(){
  const g = S.view;
  const all = Object.entries(S.cli);
  const Lst = all.filter(([id,c]) => enBucket(c,g) && pasaFiltro(id,c)).sort((a,b) => (b[1].atraso||0)-(a[1].atraso||0) || String(a[1].nombre||"").localeCompare(String(b[1].nombre||"")));
  const otros = (S.f.q||"").trim() ? all.filter(([id,c]) => !enBucket(c,g) && pasaFiltro(id,c)).slice(0,40) : [];
  const saldo = Lst.reduce((t,[,c]) => t+vencidoDe(c), 0);
  return `<div class="card">${filtros()}<div class="tiles" style="margin-top:10px"><div class="tile"><b>${Lst.length}</b><span>Cuentas</span></div><div class="tile"><b>${money(saldo)}</b><span>Vencido</span></div><div class="tile"><b>${Lst.filter(([,c]) => c.promesa?.fecha && !c.promesa.ok).length}</b><span>Promesas</span></div><div class="tile"><b>${Lst.filter(([id,c]) => tono(id,c)==="rojo").length}</b><span>En skip</span></div></div>
    <div class="row" style="margin-top:10px"><button class="btn small" id="add-c">Agregar cliente</button>${isOwner()||isBot()?`<button class="btn small dark" id="imp">Importar CSV o JSON</button>`:""}<button class="btn small ghost" id="imp-portal">Pegar lista del portal</button></div></div>
    <div class="card"><h2>${GRUPOS[g]} <span class="note">${Lst.length}</span></h2>${Lst.length?`<div class="list">${Lst.map(([id,c]) => cItem(id,c)).join("")}</div>`:`<div class="empty">No hay cuentas en este grupo con ese filtro.</div>`}</div>
    ${otros.length?`<div class="card"><h2>También coincide <span class="note">${otros.length}</span></h2><div class="list">${otros.map(([id,c]) => cItem(id,c)).join("")}</div></div>`:""}`;
}
function vHoy(){
  const mine = Object.entries(S.cli).filter(([,c]) => esMio(c));
  const pagos = mine.filter(([,c]) => pagaHoy(c));
  const llamar = mine.filter(([,c]) => c.etapa!=="cerrado" && ((c.prox && c.prox < finDia()) || (c.promesa?.fecha && !c.promesa.ok && c.promesa.fecha <= today())));
  const nv = isOwner() ? ventasNuevas() : [];
  let h = `<div class="card"><div class="tiles"><div class="tile"><b>${pagos.length}</b><span>Pagos automáticos hoy</span></div><div class="tile"><b>${llamar.length}</b><span>Para llamar hoy</span></div><div class="tile"><b>${mine.filter(([,c]) => c.etapa==="postventa").length}</b><span>En postventa vieja</span></div></div></div>`;
  h += `<div class="card"><h2>Pagos automáticos de hoy</h2><p class="note" style="margin-top:-6px">Revisa en el portal si el pago pasó.</p>${pagos.length?`<div class="list">${pagos.map(([id,c]) => cItem(id,c,`<div class="row" style="margin-top:8px"><button class="btn small" data-rv="${esc(id)}|paso">Pasó</button><button class="btn small danger" data-rv="${esc(id)}|no">No pasó</button></div>`)).join("")}</div>`:`<div class="empty">Nadie tiene pago automático hoy, o ya se revisaron.</div>`}</div>`;

function ventasCard(nv){

}

    ${isOwner()?ventasCard(ventasNuevas()):""}`;

function vPagos(){
  const r = rango(S.per);
  const acts = []; Object.entries(S.acts).forEach(([cid, arr]) => arr.forEach(a => { if (inR(a.at||0, r)) acts.push(Object.assign({clientId:cid}, a)); }));
  const pays = Object.values(S.pagos).filter(p => inR(p.at||laToMs(p.fecha,"12:00"), r)).sort((a,b) => (b.at||0)-(a.at||0));
  const gente = Object.keys(staff());
  if (isOwner() && !gente.includes(S.email)) gente.unshift(S.email);
  const deQuien = (email, a) => { const q = String(a.quien||"").toLowerCase(); const nm = String(staff()[email]?.name||"").toLowerCase(); if (q && (q===email || (nm && (q===nm || q.startsWith(nm.split(" ")[0]))))) return true; return !q && String(a.by||"").toLowerCase()===email; };
  const dias = []; for (let d = laDate(r[0]), i=0; d < laDate(r[1]) && i<31; d = addDays(d,1), i++) dias.push(d);
  const filas = gente.map(em => {
    const mias = acts.filter(a => deQuien(em, a));
    const pags = pays.filter(p => deQuien(em, p) || (!p.quien && String(p.by||"").toLowerCase()===em));
    const porDia = dias.map(d => mias.filter(a => a.tipo==="llamada" && laDate(a.at)===d).length);
    return {em, llam:mias.filter(a => a.tipo==="llamada").length, cl:new Set(mias.map(a => a.clientId)).size, prom:mias.filter(a => a.resultado==="promesa").length, np:pags.length, monto:pags.reduce((t,p)=>t+(+p.monto||0),0), porDia};
  });
  const pend = Object.values(S.links).filter(x => x.status==="pendiente");
  const puedeLlenar = isOwner() || isBot() || isDir();
  return `<div class="card"><div class="row"><div class="chips">${[["hoy","Hoy"],["semana","Esta semana"],["mes","Este mes"]].map(([k,l]) => `<button class="chip ${S.per===k?"on":""}" data-per="${k}">${l}</button>`).join("")}</div>${isOwner()||isBot()?`<button class="btn small" id="imp-act">Importar actividad</button>`:""}</div>
    <div class="tiles" style="margin-top:10px"><div class="tile"><b>${acts.filter(a=>a.tipo==="llamada").length}</b><span>Llamadas</span></div><div class="tile"><b>${new Set(acts.map(a=>a.clientId)).size}</b><span>Clientes trabajados</span></div><div class="tile"><b>${acts.filter(a=>a.resultado==="promesa").length}</b><span>Promesas</span></div><div class="tile"><b>${money(pays.reduce((t,p)=>t+(+p.monto||0),0))}</b><span>Pagos anotados</span></div></div></div>
    <div class="card"><h2>Links que hay que pedir a Hy Cite <span class="note">${pend.length}</span></h2><p class="note" style="margin-top:-6px">El botón «Pedir link» de la cuenta crea el pedido. El bot o Katerine pegan el link de Hy Cite y lo marcan listo. Si está en skip, quien bloquea el pago es Hy Cite, no esta pantalla.</p>
      ${pend.length?`<div class="list">${pend.map(x => { const c = S.cli[x.clientId]||{}; return `<div class="item ${L.esSkip(c)?"rojo":"normal"}" style="cursor:default;flex-wrap:wrap"><div style="flex:1;min-width:180px"><div class="t">${esc(c.nombre||x.nombre||"Cliente")}</div><div class="m">Pedido ${x.askedAt?fmtWhen(x.askedAt):""} · ${esc(nameOf(x.askedBy))}${L.esSkip(c)?" · en skip":""}</div></div>${puedeLlenar?`<div class="row"><input class="i" data-url="${esc(x.id)}" placeholder="https://…" style="min-width:180px"><button class="btn small" data-lista="${esc(x.id)}">Marcar lista</button></div>`:`<span class="tag tg-warn">Pendiente</span>`}</div>`; }).join("")}</div>`:`<div class="empty">No hay pedidos de link.</div>`}</div>
    <div class="card"><h2>Cobradoras</h2><p class="note" style="margin-top:-6px">Arisbel y Milady salen aquí cuando Katerine las agrega en Equipo, con el correo con el que entran a Lunaya. Las llamadas del bot se cuentan para la cobradora si el registro trae su nombre o su correo.</p>
      ${filas.length?`<div class="tbl"><table><tr><th>Quién</th><th class="n">Llamadas</th><th class="n">Clientes</th><th class="n">Promesas</th><th class="n">Pagos</th><th>Por día</th></tr>${filas.map(f => `<tr><td><b>${esc(nameOf(f.em))}</b><div class="note">${esc(f.em)}</div></td><td class="n">${f.llam}</td><td class="n">${f.cl}</td><td class="n">${f.prom}</td><td class="n">${f.np}<div class="note">${money(f.monto)}</div></td><td class="note">${f.porDia.map((n,i)=>dias[i].slice(8)+"·"+n).join(" ")}</td></tr>`).join("")}</table></div>`:`<div class="empty">Agrega a Arisbel y a Milady en Equipo para ver su tablero.</div>`}</div>
    <div class="card"><h2>Pagos anotados <span class="note">${pays.length}</span></h2><div class="tbl">${pays.length?`<table><tr><th>Fecha</th><th>Cliente</th><th class="n">Monto</th><th>Método</th><th>Quién lo anotó</th></tr>${pays.map(p => `<tr><td>${esc(p.fecha||laDate(p.at||0))}</td><td>${esc(p.nombre||"")}</td><td class="n">${money(p.monto)}</td><td>${esc(METODOS[p.metodo]||p.metodo||"")}</td><td>${esc(nameOf(p.by))}</td></tr>`).join("")}</table>`:`<p class="empty">Todavía no hay pagos en este periodo.</p>`}</div></div>`;
}

function notasTarjeta(){
  if (!S.membersLoaded) return {sel:[], notes:["Cargando personas de Lunaya…"], saved:Array.isArray(S.cfg.tarjetas)};
  const sug = L.sugerirTarjetas(S.members);
  const saved = Array.isArray(S.cfg.tarjetas);
  const notes = [];
  if (!saved) notes.push.apply(notes, sug.notes);
  if (!saved && sug.uids.length && !sug.notes.length) notes.unshift("Arisbel y Milady salen marcadas solo como sugerencia. Toca Guardar para darles acceso. Puedes quitar o agregar a quien quieras.");
  else if (!saved && sug.uids.length) notes.unshift("Marqué a quien sí encontré. Revisa y toca Guardar. Puedes cambiar la lista.");
  if (!saved && !sug.uids.length) notes.unshift("No marqué a nadie. Cuando Arisbel y Milady estén en Lunaya, salen marcadas para que tú confirmes.");
  const staffN = Object.values(staff()).map(v => String(v.name||"").toLowerCase());
  ["arisbel","milady"].forEach(p => {
    const marcada = (saved ? S.cfg.tarjetas : (S.tarDraft || sug.uids)).some(id => String(S.members[id]?.name||"").toLowerCase().includes(p) || String(S.members[id]?.email||"").toLowerCase().includes(p));
    if (!marcada && staffN.some(n => n.includes(p))) notes.push(p[0].toUpperCase()+p.slice(1)+" está en el equipo de cobranza, pero no hallé su usuario de Lunaya (hace falta para la lista de tarjetas).");
  });

}

function bindCli(id){

    const skip = !!document.getElementById("e-skip").checked;

      saldo:+qv("e-saldo")||0, vencido:+qv("e-vencido")||0, mensual:+qv("e-mensual")||0, atraso, pagosAtras:Math.max(0,+qv("e-npagos")||0), proxVence:qv("e-prox"), notasHy:qv("e-notas").slice(0,4000),
      skip, skipNota:qv("e-skipn").slice(0,500), skipLlamo:llamo, skipLlamoFecha:llamo?(qv("e-skiplf")||today()):"", updateOn:!!document.getElementById("e-upd").checked, updateMonto:+qv("e-updm")||0, updateNotas:qv("e-updn").slice(0,500), updateAprobado:qv("e-upda")==="si", updateFecha:qv("e-updf"),
      carolina:!!document.getElementById("e-car").checked, carolinaFecha:qv("e-carf"), carolinaNota:qv("e-carn").slice(0,500), carolinaAt: document.getElementById("e-car").checked ? (c.carolinaAt||Date.now()) : 0,
      beneficio:!!document.getElementById("e-be").checked, soloKat:!!document.getElementById("e-sk").checked, asignada:qv("e-as")});
    const pd = +qv("e-pd")||0; up.pago = pd ? {dia:Math.min(31,pd), monto:+qv("e-mensual")||+(c.pago&&c.pago.monto)||0} : firebase.firestore.FieldValue.delete();
    up.payLink = L.safeHttps(qv("e-link"));
    if (qv("e-link") && !up.payLink) return toast("El link tiene que empezar con https://");
    up.bucket = L.bucketOf(atraso); up.tono = L.toneOf(Object.assign({}, c, up));
    try { await ref.update(up); toast("Guardado"); openCli(id); } catch(e){ err(e); }
  };
  const pedir = document.getElementById("e-pedir"); if (pedir) pedir.onclick = () => pedirLink(id);
  const copy = document.getElementById("e-copy"); if (copy) copy.onclick = () => copiarLink(c);

  document.querySelectorAll("[data-pl]").forEach(b => b.onclick = async () => { const ok = b.dataset.pl==="ok"; const nota = ok ? "" : String(prompt("¿Qué problema hubo?")||"").slice(0,300);

  const viH = document.getElementById("vi-h"); if (viH) viH.onclick = () => ref.update({"post.visita":{when:c.post?.visita?.when||Date.now(), hecha:true, at:Date.now()}}).then(() => openCli(id), err);
  const fin = document.getElementById("post-fin"); if (fin) fin.onclick = () => ref.update({etapa:"activo", postFin:Date.now()}).then(() => { closeModal(); toast("Pasó a cobranza al día"); }, err);

}
async function logAct(clientId, partial){
  const c = S.cli[clientId]||{};
  const act = {by:S.email, quien:partial.quien||S.email, byName:nameOf(partial.quien||S.email), at:partial.at||Date.now(), tipo:partial.tipo||"nota", resultado:partial.resultado||"", mensaje:String(partial.mensaje||"").slice(0,2000), clientId};
  if (partial.promesaFecha) act.promesaFecha = partial.promesaFecha;
  if (partial.promesaMonto) act.promesaMonto = +partial.promesaMonto||0;
  const up = touch({ultContacto:act.at, contactos:firebase.firestore.FieldValue.increment(1)});
  if (act.tipo==="llamada"){ up.llamadas = firebase.firestore.FieldValue.increment(1); up.ultLlamada = act.at; }
  const no = act.resultado==="no" || act.resultado==="buzon";
  const hit = ["contesto","promesa","pago","equivocado"].includes(act.resultado);
  if (hit) up.sinContestar = 0; else if (no) up.sinContestar = firebase.firestore.FieldValue.increment(1);
  if (act.resultado==="promesa" && act.promesaFecha){ up.promesa = {fecha:act.promesaFecha, monto:act.promesaMonto||0, at:act.at, ok:false}; up.prox = laToMs(act.promesaFecha,"10:00"); }

  const nextSin = hit ? 0 : (+c.sinContestar||0) + (no?1:0);
  up.tono = L.toneOf(Object.assign({}, c, {sinContestar:nextSin}));
  const batch = S.db.batch();
  batch.set(S.db.collection("ccli").doc(clientId).collection("act").doc(), act);

  await batch.commit();
}

function resolverCobrador(raw){
  const s = String(raw||"").trim().toLowerCase(); if (!s) return "";
  const entries = Object.entries(staff());
  const em = entries.find(([k]) => k===s); if (em) return em[0];
  const by = entries.filter(([,v]) => String(v.name||"").toLowerCase()===s);
  return by.length===1 ? by[0][0] : "";
}
function findCli(row){
  const list = Object.entries(S.cli);
  const cuenta = String(row.cuenta||"").trim().toLowerCase();
  if (cuenta){ const hit = list.find(([,c]) => String(c.cuenta||"").trim().toLowerCase()===cuenta); if (hit) return hit; }
  const tel = tel10(row.tel); if (tel.length===10){ const hit = list.find(([,c]) => tel10(c.tel)===tel); if (hit) return hit; }
  if (row.clientId && S.cli[row.clientId]) return [row.clientId, S.cli[row.clientId]];
  const nombre = String(row.nombre||"").trim().toLowerCase();
  if (nombre && !cuenta) return list.find(([,c]) => String(c.nombre||"").trim().toLowerCase()===nombre) || null;
  return null;
}
async function chunked(ops){
  for (let i=0;i<ops.length;i+=400){ const b = S.db.batch(); ops.slice(i,i+400).forEach(fn => fn(b)); await b.commit(); }
}
async function guardarImport(kind, rows){
  if (kind==="ordenes"){
    const ops = rows.map(r => b => {
      const hit = Object.entries(S.post).find(([,o]) => (r.clientId && o.clientId===r.clientId && r.tracking && o.tracking===r.tracking) || (r.cuenta && o.tracking && r.tracking && o.tracking===r.tracking));
      const base = hit ? Object.assign({}, hit[1], r) : r;
      const data = ordenDoc(Object.assign({by:S.email}, base, {nombre:r.nombre||base.nombre||"Cliente"}));
      if (hit) b.set(S.db.doc("cpost/"+hit[0]), data); else b.set(S.db.collection("cpost").doc(), data);
    });
    return chunked(ops);
  }
  if (kind==="actividad"){
    const ops = [];
    let faltan = 0;
    rows.forEach(r => {
      const hit = findCli(r); if (!hit) { faltan++; return; }
      const at = r.at || (r.fecha ? laToMs(r.fecha,"12:00") : Date.now());
      const quien = resolverCobrador(r.quien) || r.quien || S.email;
      ops.push(b => b.set(S.db.collection("ccli").doc(hit[0]).collection("act").doc(), {by:S.email, quien, byName:nameOf(quien), at, tipo:r.tipo, resultado:r.resultado||"", mensaje:r.mensaje||"", clientId:hit[0], ...(r.promesaFecha?{promesaFecha:r.promesaFecha}:{}), ...(r.promesaMonto?{promesaMonto:r.promesaMonto}:{})}));
    });
    if (!ops.length) { const e = new Error("nomatch"); e.code = "nomatch"; throw e; }
    return chunked(ops);
  }
  const ops = rows.map(r => b => {
    const hit = findCli(r);
    const patch = {};
    (r._keys||[]).forEach(k => { if (k==="cobrador"||k==="cuenta"&&!r.cuenta) return; if (r[k]!==undefined && k!=="_keys") patch[k] = r[k]; });
    if (r.cobrador){ const em = resolverCobrador(r.cobrador); if (em) patch.asignada = em; }
    delete patch.cobrador; delete patch._keys;
    patch.bucket = L.bucketOf(patch.atraso!=null?patch.atraso:(hit?hit[1].atraso:0));
    Object.assign(patch, {tono:L.toneOf(Object.assign({}, hit?hit[1]:{}, patch))});
    touch(patch);
    if (hit) b.update(S.db.doc("ccli/"+hit[0]), patch);
    else b.set(S.db.collection("ccli").doc(), Object.assign({nombre:r.nombre||"Sin nombre", etapa:"activo", skip:false, payLink:"", createdAt:Date.now(), by:S.email, log:[]}, patch));
  });
  return chunked(ops);
}

      const telm = l.match(/(?:\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}/); const tel = telm ? tel10(telm[0]) : "";
      let rest = telm ? l.replace(telm[0], " ") : l; const sm = rest.match(/\$\s?[\d,]+(?:\.\d{1,2})?/); const saldo = sm ? +sm[0].replace(/[$,\s]/g,"") : 0; if (sm) rest = rest.replace(sm[0]," ");
      const dm = rest.match(/(\d{1,3})\s*(?:d[ií]as?|days?)?/i); const atraso = dm ? +dm[1] : 0; if (dm) rest = rest.replace(dm[0]," ");
      const nombre = rest.replace(/[,;|\t]+/g," ").replace(/\s+/g," ").trim().slice(0,80);
      const ya = findCli({nombre, tel, cuenta:""});
      return {nombre, tel, atraso, saldo, id:ya?ya[0]:""};
    }).filter(x => x.nombre || x.tel);
      $("#im-p").innerHTML = filas.length?`<div class="tbl"><table><tr><th>Nombre</th><th class="n">Días</th><th class="n">Saldo</th><th></th></tr>${filas.map(x=>`<tr><td>${esc(x.nombre)}</td><td class="n">${x.atraso}</td><td class="n">${money(x.saldo)}</td><td>${x.id?"actualiza":"<b>nuevo</b>"}</td></tr>`).join("")}</table></div>`:`<p class="note">No se reconoció ninguna línea.</p>`;
      $("#im-ok").disabled = !filas.length; };
    $("#im-v").onclick = parse;
    $("#im-ok").onclick = async () => { $("#im-ok").disabled = true; try {
      await chunked(filas.map(x => b => { if (x.id) b.update(S.db.doc("ccli/"+x.id), touch({atraso:x.atraso, saldo:x.saldo, vencido:x.saldo, bucket:L.bucketOf(x.atraso), ...(S.cli[x.id].etapa==="cerrado" && x.atraso>0 ? {etapa:"activo"} : {})}));
        else b.set(S.db.collection("ccli").doc(), touch({nombre:x.nombre, tel:x.tel, atraso:x.atraso, saldo:x.saldo, vencido:x.saldo, bucket:L.bucketOf(x.atraso), etapa:"activo", skip:false, payLink:"", createdAt:Date.now(), by:S.email, log:[]})); }));
      closeModal(); toast("Listo: "+filas.length); } catch(e){ $("#im-ok").disabled = false; err(e); } };
  });
}
function bind(){
  const all = (q,f) => document.querySelectorAll(q).forEach(f);
  all("[data-c]", b => b.onclick = ev => { if (ev.target.closest("button, .linkish")) return; openCli(b.dataset.c); });
  all("[data-phone]", b => b.onclick = ev => { ev.stopPropagation(); openMenu(b.dataset.phone); });
  all("[data-ord]", b => b.onclick = () => openOrden(b.dataset.ord));
  const q = $("#q"); if (q) q.oninput = () => { S.f.q = q.value; clearTimeout(S.qt); S.qt = setTimeout(() => { const pos = q.selectionStart; render(); const e = $("#q"); if (e){ e.focus(); try { e.setSelectionRange(pos,pos); } catch(err){} } }, 280); };
  const fc = $("#f-cob"); if (fc) fc.onchange = () => { S.f.cob = fc.value; render(); };
  const ft = $("#f-tono"); if (ft) ft.onchange = () => { S.f.tono = ft.value; render(); };
  const mi = $("#mios"); if (mi) mi.onchange = () => { S.f.mios = mi.checked; render(); };
  const ac = $("#add-c"); if (ac) ac.onclick = () => openNuevo();
  const im = $("#imp"); if (im) im.onclick = () => openImport("clientes");
  const ip = $("#imp-portal"); if (ip) ip.onclick = openPortal;
  const ao = $("#add-ord"); if (ao) ao.onclick = () => openOrden(null);
  const io = $("#imp-ord"); if (io) io.onclick = () => openImport("ordenes");
  const ia = $("#imp-act"); if (ia) ia.onclick = () => openImport("actividad");
  all("[data-per]", b => b.onclick = () => { S.per = b.dataset.per; render(); });
  all("[data-lista]", b => b.onclick = () => llenarLink(b.dataset.lista));
  all("[data-rv]", b => b.onclick = async ev => { ev.stopPropagation(); const [id,r] = b.dataset.rv.split("|"); const up = {["revis."+ym()]:r}; up["log"] = firebase.firestore.FieldValue.arrayUnion({at:Date.now(), by:S.email, res:"nota", nota:r==="paso"?"Pago automático: pasó":"Pago automático: NO pasó"}); if (r==="no") up.prox = Date.now(); try { await S.db.doc("ccli/"+id).update(up); toast(r==="paso"?"Anotado: pasó":"Anotado"); } catch(e){ err(e); } });
  all("[data-pv]", b => b.onclick = () => { const id = b.dataset.pv, a = S.ventas[id]||{}, p = priv(id)||{}; openNuevo({nombre:p.client||a.nomVenta||"", tel:p.phone||"", ciudad:p.city||a.zona||"", direccion:p.address||"", monto:a.amount||0, apptId:id, fechaVenta:a.when?laDate(a.when):""}); });
  const sf = $("#st-f"); if (sf) sf.onsubmit = async e => { e.preventDefault(); const em = qv("st-e").trim().toLowerCase(); if (!em) return; try { await S.db.doc("cconfig/main").set({staff:{[em]:{name:qv("st-n").trim().slice(0,60), roles:[]}}}, {merge:true}); toast("Agregada. Ahora marca qué le toca."); } catch(x){ err(x); } };
  all("[data-rol]", i => i.onchange = async () => { const [em,k] = i.dataset.rol.split("|"); const roles = new Set(staff()[em]?.roles||[]); i.checked ? roles.add(k) : roles.delete(k); try { await S.db.doc("cconfig/main").set({staff:{[em]:Object.assign({}, staff()[em], {roles:[...roles]})}}, {merge:true}); } catch(x){ err(x); } });
  all("[data-stdel]", b => b.onclick = async () => { if (!confirm("¿Quitarle el acceso a "+b.dataset.stdel+"?")) return; try { await S.db.doc("cconfig/main").update(new firebase.firestore.FieldPath("staff", b.dataset.stdel), firebase.firestore.FieldValue.delete()); } catch(x){ err(x); } });
  const tq = $("#tar-q"); if (tq) tq.oninput = () => { const s = tq.value.trim().toLowerCase(); document.querySelectorAll("[data-tarrow]").forEach(el => { el.hidden = !!(s && !el.dataset.tarrow.includes(s)); }); };
  all("[data-tar]", i => i.onchange = () => toggleTarjeta(i.dataset.tar, i.checked));
  const ts = $("#tar-save"); if (ts) ts.onclick = () => guardarTarjetas(tarjetasElegidas());
}
function tarjetasElegidas(){ return [...document.querySelectorAll("[data-tar]:checked")].map(i => i.dataset.tar).filter(id => S.members[id]?.role!=="bot"); }
function toggleTarjeta(uid, on){
  if (S.members[uid]?.role==="bot") return toast("Los bots no pueden ver tarjetas.");
  if (!Array.isArray(S.cfg.tarjetas)){ S.tarDraft = tarjetasElegidas(); return; }
  const next = (S.cfg.tarjetas||[]).filter(x => x!==uid && S.members[x]?.role!=="bot");
  if (on) next.push(uid);
  guardarTarjetas(next);
}
async function guardarTarjetas(ids){
  const limpio = [...new Set(ids)].filter(id => !S.members[id] || S.members[id].role!=="bot");
  try { await S.db.doc("cconfig/main").set({tarjetas:limpio}, {merge:true}); S.tarDraft = null; S.cfg.tarjetas = limpio; toast("Lista de tarjetas guardada"); render(); }
  catch(e){ err(e); }
}
function loginHtml(){ return `<div class="card" style="max-width:440px;margin:0 auto;width:100%"><h2>Entrar</h2><button class="btn dark" id="lg-g" style="width:100%">Entrar con Google</button>
  <p class="note" style="text-align:center">o con tu correo</p><form id="lg-f" style="display:grid;gap:10px"><input class="i" id="lg-e" type="email" placeholder="Correo" required><input class="i" id="lg-p" type="password" placeholder="Contraseña" minlength="6" required>
  <div class="row"><button class="btn" data-m="in">Entrar</button><button class="btn ghost" data-m="up">Crear cuenta</button></div></form><div id="lg-msg" class="note"></div></div>`; }
function bindLogin(){ $("#lg-g").onclick = () => { const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"}); S.auth.signInWithPopup(p).catch(() => $("#lg-msg").textContent = "No se pudo entrar con Google. Prueba con tu correo."); };
  let mode = "in"; document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => mode = b.dataset.m);
  $("#lg-f").onsubmit = e => { e.preventDefault(); const em = $("#lg-e").value.trim(), pw = $("#lg-p").value; (mode==="up" ? S.auth.createUserWithEmailAndPassword(em, pw) : S.auth.signInWithEmailAndPassword(em, pw)).catch(() => $("#lg-msg").textContent = "Correo o contraseña incorrectos."); }; }
boot();
