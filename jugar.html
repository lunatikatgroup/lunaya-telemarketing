<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¡Juega y gana!</title>
<meta name="theme-color" content="#f7efe0">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Manrope:wght@400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="portada-ad.jpg?v=3">
<style>
html,body{margin:0;min-height:100%;background:linear-gradient(#fffaf2,#f3e3c8);font-family:Manrope,-apple-system,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#jg-early{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:14px;font:700 20px/1.3 -apple-system,Helvetica,Arial,sans-serif;color:#5b1424;text-align:center}
#jg-early i{font-style:normal;font-size:72px;display:block;animation:jgb 1s ease-in-out infinite}
@keyframes jgb{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}
</style>
</head>
<body>
<div id="jg-early"><i>🎁</i>Preparando tu regalo…<span style="font-weight:500;font-size:15px;color:#8a6a3a">¡Totalmente gratis!</span></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
/* Página liviana solo para los juegos (anuncios y links de clientes): no carga la app completa */
window.S = {f:{}, programs:{}, juegos:{}, leads:{}, members:{}, appts:{}};
window.APP_URL = location.origin + location.pathname.replace(/[^/]*$/, "");
window.esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
window.toast = t => { try { const d = document.createElement("div"); d.textContent = t; d.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:12px;font:600 15px Manrope,sans-serif;z-index:999"; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); } catch {} };
window.fmt = (ms, o) => new Intl.DateTimeFormat("es-US", {timeZone:"America/Los_Angeles", ...(o||{})}).format(new Date(ms));
window.money = v => "$" + (Math.round((+v||0)*100)/100).toLocaleString("en-US");
window.laDate = ms => new Intl.DateTimeFormat("en-CA", {timeZone:"America/Los_Angeles"}).format(new Date(ms));
window.today = () => laDate(Date.now());
window.memberName = () => ""; window.firstName2 = n => String(n||"").trim().split(/\s+/)[0] || "";
window.role = () => ""; window.ownerUid = () => ""; window.pagadorDe = id => id; window.render = () => {}; window.openModal = () => {}; window.closeModal = () => {};
</script>
<script src="juego.js?v=202611271345"></script>
<script>
(function(){ const cfg = window.LUNAYA_CONFIG || {}; const qs = new URLSearchParams(location.search); const code = qs.get("j");
  if (!code){ document.getElementById("jg-early").innerHTML = "<i>🎁</i>Este link no está completo."; return; }
  firebase.initializeApp(cfg.firebase); S.db = firebase.firestore(); try { S.db.settings({experimentalAutoDetectLongPolling:true, merge:true}); } catch(e){}
  const falla = m => { const b = document.getElementById("jg"); if (!b || !/Preparando/.test(b.textContent)) return; b.innerHTML = `<div class="jg-h">No se pudo cargar</div><p class="jg-p">Revisa tu conexión y vuelve a intentar.</p><button class="jg-btn" onclick="location.reload()">Reintentar</button><p class="jg-small" style="opacity:.6">${String(m||"").replace(/[<>&]/g,"").slice(0,160)}</p>`; };
  window.addEventListener("error", e => falla("e: " + (e.message||"") + " " + (e.lineno||"")));
  window.addEventListener("unhandledrejection", e => falla("p: " + ((e.reason && (e.reason.message||e.reason))||"")));
  setTimeout(() => falla("t: " + (window.__paso||"?")), 25000);
  window.__paso = "inicio"; Promise.resolve(startJuego(code, qs.get("a")==="1")).catch(e => falla("c: " + (e && e.message || e))); })();
</script>
</body>
</html>
